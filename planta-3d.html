<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planta Bentley 3D</title>
<style>
:root{
  --bg:#0b0d17; --panel:rgba(16,19,34,.92); --line:rgba(255,255,255,.10);
  --tx:#e9ecf5; --mut:#8a90a8; --amber:#ffc53d; --red:#ff4d5e; --green:#30d158; --cyan:#3ad6ff;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
#escena{position:fixed;inset:0;}
#etiquetas{position:fixed;inset:0;pointer-events:none;}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(10,12,24,.88);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;font-size:11px;line-height:1.3;white-space:nowrap;pointer-events:auto;cursor:pointer;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:none;-webkit-user-select:none;}
.tag:empty{display:none;}
.tag b{font-size:12px;}
.tag .paso{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:4px;margin-right:5px;
  font-size:10px;font-weight:700;color:#0b0d17;}
.tag .sub{color:var(--mut);}
.tag.alerta{border-color:var(--red);}
.tag.alerta .sub{color:#ff8a95;}
.tag.mini{font-size:9.5px;padding:2px 5px;border-radius:5px;}
.tag.nombre{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;
  background:rgba(255,255,255,.92);color:#11142a;border:0;pointer-events:none;}
#tip{position:fixed;z-index:6;pointer-events:none;display:none;background:rgba(10,12,24,.95);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.35;max-width:260px;}
#tip .sub{color:var(--mut);}
#barra{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 16px;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,13,23,.95),rgba(11,13,23,0));z-index:5;flex-wrap:wrap;}
#barra > *{pointer-events:auto;}
#barra h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px;}
#barra h1 span{color:var(--amber);}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);}
.chip.vivo{color:var(--green);border-color:rgba(48,209,88,.4);}
.chip.vivo::before{content:"● ";}
.chip.demo{color:var(--amber);border-color:rgba(255,197,61,.4);}
#barra .esp{flex:1;}
#barra button,#panel button{font:inherit;font-size:12px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;cursor:pointer;}
#barra button:hover,#panel button:hover{background:rgba(255,255,255,.12);}
#kpis{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;z-index:4;flex-wrap:wrap;max-width:calc(100% - 350px);}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px;}
.kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.kpi .l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;}
#feed{position:fixed;right:16px;bottom:16px;width:300px;max-height:30vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:4;font-size:11px;}
#feed h3{margin:0 0 6px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;}
#feed .ev{padding:5px 0;border-top:1px solid var(--line);}
#feed .ev:first-of-type{border-top:0;}
#feed .ev .t{color:var(--mut);}
#panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);
  z-index:10;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;backdrop-filter:blur(8px);}
#panel.abierto{transform:none;}
#panel header{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;}
#panel header h2{margin:0;font-size:16px;}
#panel header p{margin:4px 0 0;font-size:12px;color:var(--mut);}
#panel header .esp{flex:1;}
#panel .lista{overflow:auto;flex:1;padding:6px 16px 16px;}
.ot{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;}
.ot .r1{display:flex;justify-content:space-between;gap:8px;}
.ot .r1 b{font-size:12.5px;}
.ot .r2{color:var(--mut);margin-top:2px;}
.ot .atr{color:var(--red);font-weight:600;}
.ot.taller{cursor:pointer;}
.ot.taller:hover{background:rgba(255,255,255,.04);}
.grupo{margin-top:12px;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;}
.nota{font-size:11.5px;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;}
#aviso{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:var(--bg);text-align:center;padding:24px;}
#aviso.on{display:flex;}
#aviso a{color:var(--cyan);}
#cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;z-index:3;pointer-events:none;}
@media (max-width:700px){
  #feed{display:none;}
  #kpis{max-width:calc(100% - 32px);}
  .kpi{min-width:0;padding:6px 9px;}
  .kpi .v{font-size:15px;}
  #barra h1{font-size:13px;}
  .tag{font-size:9.5px;padding:3px 6px;}
}
</style>
</head>

<div id="escena"></div>

<div id="tip"></div>

<div id="barra">
  <h1>PLANTA <span>BENTLEY</span> · producción en vivo</h1>
  <span id="estadoConexion" class="chip">conectando…</span>
  <span id="horaSync" class="chip"></span>
  <span class="esp"></span>
  <button id="btnTV" title="Pantalla completa y cámara girando">Modo TV</button>
  <button id="btnApp" title="Abrir la app de producción">Abrir app</button>
</div>

<div id="kpis"></div>
<div id="feed"><h3>Movimientos recientes</h3><div id="feedLista"></div></div>

<aside id="panel">
  <header>
    <div><h2 id="pTitulo"></h2><p id="pSub"></p></div>
    <span class="esp"></span>
    <button id="pCerrar">Cerrar</button>
  </header>
  <div class="lista" id="pLista"></div>
</aside>

<div id="aviso"><div>
  <p>Para ver la planta primero inicia sesión en la app de producción.</p>
  <p><a href="produccion-bentley.html">Ir a la app de producción</a></p>
</div></div>

<!-- ─── Lógica pura (sin DOM ni Three.js): se prueba también en Node ─────────── -->
<script id="logica">
'use strict';
// Recorrido de la planta, en orden. Calidad y salida no tienen estado propio en la app:
// se derivan de la fecha en que el taller entregó (últimos 7 días = en calidad/empaque).
var SALAS = [
  {id:'diseno',       paso:1, nombre:'Diseño',             color:0xb06cff},
  {id:'programacion', paso:2, nombre:'Programación',       color:0x7c5cff, estados:['POR_REVISAR']},
  {id:'corte',        paso:3, nombre:'Corte',              color:0xff7a2f, estados:['PENDIENTE_CORTAR']},
  {id:'alistamiento', paso:4, nombre:'Alistamiento',       color:0x2fb7ff, estados:['CORTE_POR_ALISTAR','ASIGNADO']},
  {id:'talleres',     paso:5, nombre:'Talleres',           color:0xffc53d, estados:['EN_CONFECCION','ENTREGADO_PARCIAL']},
  {id:'novedades',    paso:'!', nombre:'Novedades',        color:0xff4d5e, estados:['NOVEDAD']},
  {id:'calidad',      paso:6, nombre:'Calidad y empaque',  color:0x2ee6b6},
  {id:'salida',       paso:7, nombre:'Salida',             color:0x30d158}
];
var SALA_DE_ESTADO = {};
SALAS.forEach(function(s){ (s.estados || []).forEach(function(e){ SALA_DE_ESTADO[e] = s.id; }); });
var ESTADOS_ENTREGADOS = {ENTREGADO:1, PAGO_PENDIENTE:1, PAGADO:1};
var DIAS_CALIDAD = 7;

function _uds(o){ return Number(o && o.cantidad) || 0; }
function _udsPend(o){
  // En el taller importa lo que falta por llegar, no lo ya entregado.
  if(o.estado === 'ENTREGADO_PARCIAL' && o.unidades_por_llegar != null) return Number(o.unidades_por_llegar) || 0;
  return _uds(o);
}
function _udsEntregadas(o){ return Number(o.unidades_entregadas) || _uds(o); }
function _dias(desdeISO, hastaISO){ return Math.round((Date.parse(hastaISO) - Date.parse(desdeISO)) / 86400000); }
function diasAtraso(o, hoyISO){
  var f = o && o.fecha_estimada_entrega;
  if(!f || !hoyISO) return 0;
  var d = _dias(String(f).slice(0,10), hoyISO);
  return d > 0 ? d : 0;
}
// Fecha en que el taller entregó: fecha_entrega_real o, si no está, la última anotación de
// entrega/paso a pago en el historial.
function fechaEntrega(o){
  if(o.fecha_entrega_real) return String(o.fecha_entrega_real).slice(0,10);
  var h = Array.isArray(o.historial) ? o.historial : [];
  for(var i = h.length - 1; i >= 0; i--){
    var e = h[i];
    if(!e) continue;
    var txt = String(e.accion || e.evento || e.nota || '');
    if(/ENTREG|Pago/i.test(txt) && e.fecha) return String(e.fecha).slice(0,10);
  }
  return '';
}
function salaDeOT(o, hoyISO){
  if(!o || !o.estado) return null;
  if(SALA_DE_ESTADO[o.estado]) return SALA_DE_ESTADO[o.estado];
  if(ESTADOS_ENTREGADOS[o.estado]){
    var f = fechaEntrega(o);
    if(!f) return null;
    var d = _dias(f, hoyISO);
    if(d >= 0 && d < DIAS_CALIDAD) return 'calidad';
    if(f.slice(0,7) === hoyISO.slice(0,7)) return 'salida';
  }
  return null;
}

function satNombre(o, porId){
  if(o.satelite_id && porId[o.satelite_id]) return porId[o.satelite_id].nombre;
  return o.satelite_nombre || (o.satelite_id ? 'Taller ' + o.satelite_id : 'SIN TALLER');
}

// datos = {ots, satelites, disenos, trazos, logistica}; todo opcional salvo ots.
function estadoPlanta(datos, hoyISO){
  var ots = datos.ots || [];
  var porId = {};
  (datos.satelites || []).forEach(function(s){ if(s && s.id) porId[s.id] = s; });

  var salas = {};
  SALAS.forEach(function(s){ salas[s.id] = {id:s.id, nombre:s.nombre, ots:[], nOTs:0, uds:0, vencidas:0}; });

  // Un registro por taller activo, aunque hoy no tenga OTs (se ven todos en la sala).
  var talleres = {};
  function taller(nombre, sat){
    return talleres[nombre] || (talleres[nombre] = {nombre:nombre, personas:Number(sat && sat.personas) || 0,
      ots:[], nOTs:0, uds:0, vencidas:0, maxAtraso:0, novOTs:[], novUds:0, udsMes:0});
  }
  (datos.satelites || []).forEach(function(s){ if(s && s.nombre && s.activo !== false) taller(s.nombre, s); });

  var mes = hoyISO.slice(0,7);
  ots.forEach(function(o){
    var sid = salaDeOT(o, hoyISO);
    if(ESTADOS_ENTREGADOS[o.estado] && fechaEntrega(o).slice(0,7) === mes && (o.satelite_id || o.satelite_nombre)){
      taller(satNombre(o, porId), porId[o.satelite_id]).udsMes += _udsEntregadas(o);
    }
    if(!sid) return;
    var s = salas[sid];
    var u = sid === 'talleres' ? _udsPend(o) : (sid === 'calidad' || sid === 'salida') ? _udsEntregadas(o)
          : sid === 'novedades' ? (Number(o.unidades_novedad) || (_uds(o) - (Number(o.unidades_entregadas) || 0))) : _uds(o);
    var atr = sid === 'talleres' ? diasAtraso(o, hoyISO) : 0;
    s.ots.push(o); s.nOTs++; s.uds += u; if(atr > 0) s.vencidas++;
    if(sid === 'talleres'){
      var t = taller(satNombre(o, porId), porId[o.satelite_id]);
      t.ots.push(o); t.nOTs++; t.uds += u;
      if(atr > 0){ t.vencidas++; if(atr > t.maxAtraso) t.maxAtraso = atr; }
    }
    if(sid === 'novedades'){
      var tn = taller(satNombre(o, porId), porId[o.satelite_id]);
      tn.novOTs.push(o); tn.novUds += u;
    }
  });
  var lista = Object.keys(talleres).map(function(k){ return talleres[k]; })
    .sort(function(a,b){ return b.uds - a.uds || b.udsMes - a.udsMes || a.nombre.localeCompare(b.nombre); });

  // Diseño: todo lo que aún no está "listo para producción".
  var dis = (datos.disenos || []).filter(Boolean);
  var porKanban = {};
  dis.forEach(function(d){ var k = d.kanban_estado || 'SIN_ESTADO'; porKanban[k] = (porKanban[k] || 0) + 1; });
  var enDiseno = dis.filter(function(d){ return d.kanban_estado !== 'LISTA_PRODUCCION'; });
  salas.diseno.ots = enDiseno; salas.diseno.nOTs = enDiseno.length;

  var trazos = (datos.trazos || []).filter(Boolean);
  var logHoy = (datos.logistica || []).filter(function(t){ return t && String(t.fecha || '').slice(0,10) === hoyISO; })
    .sort(function(a,b){ return (Number(a.orden) || 0) - (Number(b.orden) || 0); });

  var enProceso = 0;
  ['programacion','corte','alistamiento','talleres','novedades'].forEach(function(k){ enProceso += salas[k].uds; });
  return {
    salas:salas, talleres:lista, enProceso:enProceso, hoy:hoyISO,
    diseno:{total:dis.length, enDiseno:enDiseno.length, porKanban:porKanban},
    trazos:{total:trazos.length, lista:trazos},
    logistica:{hoy:logHoy, pendientes:logHoy.filter(function(t){ return t.estado !== 'completado'; }).length},
    talleresActivos:lista.filter(function(t){ return t.nOTs > 0; }).length,
    talleresNovedad:lista.filter(function(t){ return t.novOTs.length > 0; })
  };
}

// Compara dos fotos de OTs y devuelve las que cambiaron de sala (para animar el traslado).
function diffOTs(prev, next, hoyISO, satelites){
  var porId = {};
  (satelites || []).forEach(function(s){ if(s && s.id) porId[s.id] = s; });
  var antes = {};
  (prev || []).forEach(function(o){ if(o && o.id) antes[o.id] = o; });
  var movs = [];
  (next || []).forEach(function(o){
    if(!o || !o.id) return;
    var a = antes[o.id];
    var hasta = salaDeOT(o, hoyISO);
    if(!hasta) return;
    var desde = a ? salaDeOT(a, hoyISO) : null;
    var tA = a ? satNombre(a, porId) : null, tB = satNombre(o, porId);
    if(!a || desde !== hasta || (hasta === 'talleres' && tA !== tB)) movs.push({id:o.id, de:desde, a:hasta, taller:tB, uds:_uds(o)});
  });
  return movs;
}

// Firebase guarda las llaves con . # $ / [ ] % codificadas (igual que _fbDecKeys de la app).
function _fbDecKey(k){ return k.indexOf('%')<0 ? k : k.replace(/%(25|2E|23|24|2F|5B|5D)/g, function(m,h){ return String.fromCharCode(parseInt(h,16)); }); }
function _fbDecKeys(v){
  if(Array.isArray(v)) return v.map(_fbDecKeys);
  if(v && typeof v==='object'){ var o={}; Object.keys(v).forEach(function(k){ o[_fbDecKey(k)] = _fbDecKeys(v[k]); }); return o; }
  return v;
}
// Firebase convierte arreglos con huecos en objetos {0:..,5:..}.
function _comoLista(v){
  if(Array.isArray(v)) return v.filter(Boolean);
  if(v && typeof v==='object') return Object.keys(v).map(function(k){ return v[k]; }).filter(Boolean);
  return [];
}

if(typeof module !== 'undefined') module.exports = {SALAS:SALAS, estadoPlanta:estadoPlanta, diffOTs:diffOTs, diasAtraso:diasAtraso, fechaEntrega:fechaEntrega, salaDeOT:salaDeOT, _fbDecKeys:_fbDecKeys, _comoLista:_comoLista};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
'use strict';
// Vista SOLO LECTURA: esta página nunca escribe en Firebase ni en GitHub.
var PARAMS = new URLSearchParams(location.search);
var DEMO = PARAMS.has('demo');
var fmt = function(n){ return Math.round(n || 0).toLocaleString('es-CO'); };
function hoyBogota(){ return new Date().toLocaleDateString('en-CA', {timeZone:'America/Bogota'}); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function corto(n){ return String(n || '').split(' ').slice(0, 2).join(' '); }

// ─── Guard de sesión (misma sesión de produccion-bentley.html) ───────────────
function sesion(){
  try{
    var s = localStorage.getItem('bentley_prod_auth') || sessionStorage.getItem('bentley_prod_auth');
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}
if(!sesion()){
  document.getElementById('aviso').classList.add('on');
  document.getElementById('cargando').style.display = 'none';
  throw new Error('sin sesión');
}

// ─── Escena base ─────────────────────────────────────────────────────────────
var cont = document.getElementById('escena');
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
cont.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d17);

var FRUSTUM = 90;
var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -300, 500);
function ajustarCamara(){
  var a = innerWidth / innerHeight;
  // En celular vertical manda el ancho: que quepa la planta de lado a lado.
  var f = a < 1 ? 70 / a : FRUSTUM;
  camera.left = -f * a / 2; camera.right = f * a / 2; camera.top = f / 2; camera.bottom = -f / 2;
  camera.updateProjectionMatrix();
}
camera.position.set(70, 75, 70);
camera.lookAt(0, 0, 0);
ajustarCamara();

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minZoom = 0.6; controls.maxZoom = 5;
controls.maxPolarAngle = Math.PI * 0.42;
controls.minPolarAngle = Math.PI * 0.10;
controls.target.set(-4, 0, -4);
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0xb9c4ff, 0x1a1030, 0.8));
var sol = new THREE.DirectionalLight(0xffffff, 0.8);
sol.position.set(40, 80, 25);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
var sc = sol.shadow.camera; sc.left = -80; sc.right = 80; sc.top = 80; sc.bottom = -80; sc.near = 1; sc.far = 250;
scene.add(sol);

(function(){
  var g = new THREE.BufferGeometry(), p = [];
  for(var i = 0; i < 700; i++) p.push((Math.random() - .5) * 360, -10 - Math.random() * 30, (Math.random() - .5) * 360);
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x6670a0, size:0.35})));
  var piso = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), new THREE.MeshStandardMaterial({color:0x10132a, roughness:1}));
  piso.rotation.x = -Math.PI / 2; piso.position.y = -0.3; piso.receiveShadow = true;
  scene.add(piso);
  var grid = new THREE.GridHelper(320, 80, 0x1d2244, 0x161a36);
  grid.position.y = -0.28; scene.add(grid);
})();

var MAT = {};
function mat(color, extra){
  var k = color + (extra ? JSON.stringify(extra) : '');
  if(!MAT[k]) MAT[k] = new THREE.MeshStandardMaterial(Object.assign({color:color, roughness:0.75, metalness:0.05}, extra || {}));
  return MAT[k];
}
var GEO = {};
function geoCaja(w, h, d){ var k = w + 'x' + h + 'x' + d; return GEO[k] || (GEO[k] = new THREE.BoxGeometry(w, h, d)); }
function caja(w, h, d, color, x, y, z, extra){
  var m = new THREE.Mesh(geoCaja(w, h, d), mat(color, extra));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
var COLOR_SALA = {}, SALA = {};
SALAS.forEach(function(s){ COLOR_SALA[s.id] = '#' + s.color.toString(16).padStart(6, '0'); SALA[s.id] = s; });

// ─── Personas animadas ───────────────────────────────────────────────────────
// Cada persona tiene torso, cabeza y dos brazos con pivote en el hombro; "accion" define
// cómo se mueve: cortar, coser, teclear, cargar (camina entre dos puntos), inspeccionar, dirigir.
var PIEL = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524];
var ROPA = [0x2b2d42, 0x3a86ff, 0xef476f, 0x06d6a0, 0x8338ec, 0xffbe0b, 0xfb5607, 0x118ab2];
var G_TORSO = new THREE.CylinderGeometry(0.3, 0.38, 0.95, 8);
var G_CABEZA = new THREE.SphereGeometry(0.28, 10, 8);
var G_BRAZO = new THREE.BoxGeometry(0.16, 0.6, 0.16);
var G_PIERNA = new THREE.BoxGeometry(0.18, 0.5, 0.18);
var personas = [];
function persona(x, z, seed, accion, opts){
  opts = opts || {};
  var g = new THREE.Group();
  var ropa = opts.ropa != null ? opts.ropa : ROPA[seed % ROPA.length];
  var pierL = new THREE.Mesh(G_PIERNA, mat(0x22253d)); pierL.position.set(-0.13, 0.25, 0);
  var pierR = new THREE.Mesh(G_PIERNA, mat(0x22253d)); pierR.position.set(0.13, 0.25, 0);
  var torso = new THREE.Mesh(G_TORSO, mat(ropa)); torso.position.y = 0.95; torso.castShadow = true;
  var cabeza = new THREE.Mesh(G_CABEZA, mat(PIEL[seed % PIEL.length])); cabeza.position.y = 1.65; cabeza.castShadow = true;
  function brazo(lado){
    var piv = new THREE.Group(); piv.position.set(0.42 * lado, 1.32, 0);
    var b = new THREE.Mesh(G_BRAZO, mat(ropa)); b.position.y = -0.28; piv.add(b);
    return piv;
  }
  var bL = brazo(-1), bR = brazo(1);
  g.add(pierL); g.add(pierR); g.add(torso); g.add(cabeza); g.add(bL); g.add(bR);
  g.position.set(x, opts.y || 0.3, z);
  if(opts.rotY != null) g.rotation.y = opts.rotY;
  if(opts.escala) g.scale.setScalar(opts.escala);
  g.userData = {accion:accion || 'idle', fase:seed * 1.37, bL:bL, bR:bR, cabeza:cabeza, torso:torso, pierL:pierL, pierR:pierR,
    base:new THREE.Vector3(x, opts.y || 0.3, z), destino:opts.destino || null, rotY:g.rotation.y};
  personas.push(g);
  return g;
}
function animarPersona(p, t){
  var u = p.userData, f = u.fase;
  switch(u.accion){
    case 'cortar':   // los dos brazos al frente, deslizando la tijera/cuchilla
      u.bL.rotation.x = -1.1 + Math.sin(t * 5 + f) * 0.35;
      u.bR.rotation.x = -1.1 + Math.sin(t * 5 + f) * 0.35;
      u.torso.rotation.y = Math.sin(t * 2.5 + f) * 0.15;
      break;
    case 'coser':    // brazos cortos y rápidos, cabeza mirando la máquina
      u.bL.rotation.x = -0.9 + Math.sin(t * 14 + f) * 0.12;
      u.bR.rotation.x = -0.9 + Math.cos(t * 14 + f) * 0.12;
      u.cabeza.rotation.x = 0.25 + Math.sin(t * 7 + f) * 0.05;
      break;
    case 'teclear':
      u.bL.rotation.x = -0.8 + Math.sin(t * 11 + f) * 0.1;
      u.bR.rotation.x = -0.8 + Math.sin(t * 11 + f + 1.6) * 0.1;
      u.cabeza.rotation.y = Math.sin(t * 0.8 + f) * 0.3;
      break;
    case 'inspeccionar': // levanta la prenda, la gira, la baja
      u.bR.rotation.x = -1.6 + Math.sin(t * 1.6 + f) * 0.5;
      u.bL.rotation.x = -0.9 + Math.sin(t * 1.6 + f + 1) * 0.3;
      u.torso.rotation.y = Math.sin(t * 0.9 + f) * 0.4;
      break;
    case 'dirigir':  // Mesa de control: gira mirando la planta y señala
      p.rotation.y = u.rotY + Math.sin(t * 0.5 + f) * 1.2;
      u.bR.rotation.x = -1.3 + Math.sin(t * 1.2 + f) * 0.3;
      u.bR.rotation.z = 0.3;
      break;
    case 'cargar':   // camina ida y vuelta entre base y destino con los brazos al frente
      if(u.destino){
        var k = (Math.sin(t * 0.7 + f) + 1) / 2;
        p.position.lerpVectors(u.base, u.destino, k);
        var vel = Math.cos(t * 0.7 + f);
        p.rotation.y = Math.atan2(u.destino.x - u.base.x, u.destino.z - u.base.z) + (vel < 0 ? Math.PI : 0);
        u.pierL.rotation.x = Math.sin(t * 9 + f) * 0.5;
        u.pierR.rotation.x = -Math.sin(t * 9 + f) * 0.5;
      }
      u.bL.rotation.x = u.bR.rotation.x = -1.2;
      break;
    case 'idle':     // taller sin OTs: casi quieto
      u.cabeza.rotation.y = Math.sin(t * 0.4 + f) * 0.4;
      break;
  }
}

var labelsDiv = document.getElementById('etiquetas');
var etiquetas = [];
function etiqueta(html, pos, clase, onClick, seguir){
  var el = document.createElement('div');
  el.className = 'tag' + (clase ? ' ' + clase : '');
  el.innerHTML = html;
  if(onClick) el.addEventListener('click', onClick);
  labelsDiv.appendChild(el);
  var e = {el:el, pos:pos.clone(), seguir:seguir || null};
  etiquetas.push(e);
  return e;
}

var clicables = [];
function piezaSala(id, color, p){
  var g = new THREE.Group();
  var base = caja(p.w, 0.5, p.d, color, 0, -0.3, 0, {roughness:0.6});
  var piso = caja(p.w - 0.8, 0.12, p.d - 0.8, 0xe9e2d0, 0, 0.2, 0);
  g.add(base); g.add(piso);
  g.add(caja(p.w, 2.4, 0.35, color, 0, 0.2, -p.d / 2 + 0.17));
  g.add(caja(0.35, 2.4, p.d, color, -p.w / 2 + 0.17, 0.2, 0));
  g.position.set(p.x, 0, p.z);
  [base, piso].forEach(function(m){ m.userData.abrir = id; clicables.push(m); });
  scene.add(g);
  return g;

var FLUJO = [['diseno','programacion'],['programacion','corte'],['corte','alistamiento'],['alistamiento','talleres'],
             ['talleres','calidad'],['calidad','salida'],['talleres','novedades'],['novedades','talleres']];
var particulas = [];
function centro(id){ var p = POS[id]; return new THREE.Vector3(p.x, 0, p.z); }
function ruta(de, a){
  // Alistamiento baja a talleres por el costado; talleres sale a calidad por su borde izquierdo.
  var A = centro(de), B = centro(a);
  if(de === 'alistamiento' && a === 'talleres') return [A, new THREE.Vector3(A.x, 0, POS.talleres.z - POS.talleres.d / 2 + 1)];
  if(de === 'talleres' && a === 'calidad') return [new THREE.Vector3(POS.talleres.x - POS.talleres.w / 2 + 1, 0, POS.calidad.z), B];
  if(de === 'talleres' && a === 'novedades') return [new THREE.Vector3(POS.talleres.x + POS.talleres.w / 2 - 1, 0, POS.novedades.z - 2), new THREE.Vector3(B.x, 0, B.z - 2)];
  if(de === 'novedades' && a === 'talleres') return [new THREE.Vector3(A.x, 0, A.z + 2), new THREE.Vector3(POS.talleres.x + POS.talleres.w / 2 - 1, 0, A.z + 2)];
  return [A, B];
}
function via(a, b, color){
  var dir = b.clone().sub(a), len = dir.length();
  var m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.08, 1.8), mat(0x1c2040));
  m.position.copy(a.clone().add(b).multiplyScalar(0.5)); m.position.y = -0.2;
  m.rotation.y = -Math.atan2(dir.z, dir.x);
  m.receiveShadow = true;
  scene.add(m);
  for(var i = 0; i < Math.max(2, Math.floor(len / 5)); i++){
    var pt = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), mat(color, {emissive:color, emissiveIntensity:1.2}));
    scene.add(pt);
    particulas.push({m:pt, a:a, b:b, t:i / Math.max(2, Math.floor(len / 5)), vel:2.2 / len});
  }
}

var capa = new THREE.Group(); scene.add(capa);

var alertaNov = null;
function limpiarDinamico(){
  while(capa.children.length) capa.remove(capa.children[0]);
  personasDinamicas.forEach(function(p){ var i = personas.indexOf(p); if(i >= 0) personas.splice(i, 1); });
  personasDinamicas = [];
  etqDinamicas.forEach(function(e){ e.el.remove(); etiquetas.splice(etiquetas.indexOf(e), 1); });
  etqDinamicas = [];
  for(var i = clicables.length - 1; i >= 0; i--) if(clicables[i].userData.dinamico) clicables.splice(i, 1);
  CASAS = {};
}
function personaDin(x, z, seed, accion, opts){
  var p = persona(x, z, seed, accion, opts);
  capa.add(p); personasDinamicas.push(p);
  return p;
}

// Talleres: TODOS los activos, en orden de mayor a menor producción en curso.
var COLS_TALLER = 12;
function casaTaller(t, i, cont, origen, celda, conNovedad){
  var cols = origen.cols;
  var x = origen.x + celda.w * (i % cols) + celda.w / 2;
  var z = origen.z + celda.d * Math.floor(i / cols) + celda.d / 2;
  var activo = conNovedad ? true : t.nOTs > 0;
  var col = conNovedad ? 0xff4d5e : (t.vencidas ? 0xff4d5e : (activo ? 0xffc53d : 0x5a5f78));
  var g = new THREE.Group();
  var base = caja(celda.w - 0.5, 0.25, celda.d - 0.6, col, 0, -0.05, 0);
  var piso = caja(celda.w - 0.9, 0.08, celda.d - 1.0, activo ? 0xefe8d6 : 0x8d90a3, 0, 0.2, 0);
  g.add(base); g.add(piso);
  g.add(caja(celda.w - 0.5, 1.0, 0.18, col, 0, 0.2, -(celda.d - 0.6) / 2 + 0.09));
  // Gente: según personas registradas del taller (máx 3 visibles); trabajando si tiene OTs
  var n = activo ? Math.min(3, Math.max(1, t.personas || Math.ceil(t.nOTs / 3))) : 1;
  var paso = (celda.w - 1.6) / Math.max(1, n);
  for(var m = 0; m < n; m++){
    var mx = -(celda.w - 1.6) / 2 + paso * (m + 0.5);
    g.add(caja(0.7, 0.5, 0.5, activo ? 0xffffff : 0xb5b8c8, mx, 0.28, -0.6));
    var per = persona(mx, 0.2, i * 3 + m, activo ? 'coser' : 'idle', {rotY:Math.PI, escala:0.62, y:0.28});
    g.add(per); personasDinamicas.push(per);
  }
  g.position.set(x, 0, z);
  var clave = (conNovedad ? 'nov:' : 'sat:') + t.nombre;
  [base, piso].forEach(function(mm){ mm.userData.abrir = clave; mm.userData.dinamico = true; mm.userData.tip = t; mm.userData.nov = !!conNovedad; clicables.push(mm); });
  cont.add(g);
  if(!conNovedad) CASAS[t.nombre] = new THREE.Vector3(x, 0, z);
  return new THREE.Vector3(x, 1.4, z - celda.d / 2 + 0.6);
}

    (sub ? '<br><span class="sub">' + sub + '</span>' : '');
}

var ESTADO = null;
function actualizarEscena(est){
  ESTADO = est;
  limpiarDinamico();
  var S = est.salas;

  // Diseño

var raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(), downXY = null;
var tip = document.getElementById('tip');
function pick(e){
  mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1;

renderer.domElement.addEventListener('pointerdown', function(e){ downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', function(e){

  var hit = pick(e);

  renderer.domElement.style.cursor = hit ? 'pointer' : '';

// ─── Bucle de render ─────────────────────────────────────────────────────────
var reloj = new THREE.Clock(), vProj = new THREE.Vector3(), vTmp = new THREE.Vector3();
function puntoRuta(r, k){
  var tramos = r.length - 1, x = k * tramos, i = Math.min(tramos - 1, Math.floor(x));
  return r[i].clone().lerp(r[i + 1], x - i);
}
function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(reloj.getDelta(), 0.1), t = reloj.elapsedTime;
  controls.update();
  nucleo.rotation.y += dt * 0.6; nucleo.position.y = 3.6 + Math.sin(t * 1.5) * 0.25;
  for(var i = 0; i < personas.length; i++) animarPersona(personas[i], t);
  particulas.forEach(function(p){
    p.t = (p.t + dt * p.vel) % 1;
    p.m.position.copy(p.a).lerp(p.b, p.t); p.m.position.y = 0.05;
  });
  // Furgoneta de Elías recorriendo su ruta
  var kv = (t * 0.025) % 1, pv = puntoRuta(RUTA_VAN, kv), pn = puntoRuta(RUTA_VAN, (kv + 0.003) % 1);
  van.position.set(pv.x, 0, pv.z);
  van.rotation.y = -Math.atan2(pn.z - pv.z, pn.x - pv.x);
  if(alertaNov) alertaNov.position.y = 3.4 + Math.abs(Math.sin(t * 3)) * 0.6;
  for(var j = viajes.length - 1; j >= 0; j--){
    var v = viajes[j];
    v.t += dt * 0.4;
    if(v.t < 0){ v.m.visible = false; continue; }
    v.m.visible = true;
    var tt = Math.min(v.t, 1);
    v.m.position.copy(v.a).lerp(v.b, tt); v.m.position.y = 0.4 + Math.sin(tt * Math.PI) * 3;
    if(v.t >= 1){ scene.remove(v.m); viajes.splice(j, 1); }
  }
  renderer.render(scene, camera);
  // Etiquetas: las de talleres fuera del top 12 solo con zoom
  var w2 = innerWidth / 2, h2 = innerHeight / 2, verZoom = camera.zoom >= 1.8, verTop = camera.zoom >= 0.95;
  etiquetas.forEach(function(e){
    var cl = e.el.classList;
    if(cl.contains('zoom') && !verZoom){ e.el.style.display = 'none'; return; }
    if(cl.contains('top') && !verTop){ e.el.style.display = 'none'; return; }
    if(cl.contains('nombre') && camera.zoom < 0.9){ e.el.style.display = 'none'; return; }
    e.el.style.display = '';
    if(e.seguir){ e.seguir.getWorldPosition(vTmp); vTmp.y += 2.5; vProj.copy(vTmp); }
    else vProj.copy(e.pos);
    vProj.project(camera);
    e.el.style.left = (vProj.x * w2 + w2) + 'px';
    e.el.style.top = (-vProj.y * h2 + h2) + 'px';
  });
}

    if(!DATOS.ots) return;

    _porIdSat = {};

  }, 250);
}
