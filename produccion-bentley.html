<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRODUCCION BENTLEY</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --card: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --radius: 14px;
  --cyan: #00d4ff;
  --green: #34d399;
  --red: #ff3b30;
  --gold: #ffd60a;
  --text: #e8f0fe;
  --dim: rgba(255,255,255,0.45);
  --sidebar-w: 200px;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  --bebas: 'Bebas Neue', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;}

/* Sidebar */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;
  background:rgba(0,0,0,0.4);border-right:1px solid var(--card-border);
  display:flex;flex-direction:column;z-index:200;transition:transform .3s;overflow:hidden;
}
#sidebar-logo{padding:20px 16px 12px;border-bottom:1px solid var(--card-border);}
#sidebar-logo .brand{font-family:var(--bebas);font-size:22px;color:var(--cyan);letter-spacing:1px;line-height:1;}
#sidebar-logo .sub{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
#sidebar nav{flex:1;padding:8px 0;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--dim);transition:all .2s;border-left:3px solid transparent;
  user-select:none;white-space:nowrap;
}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.nav-item.active{color:var(--cyan);border-left-color:var(--cyan);background:rgba(0,212,255,0.06);}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
#sidebar-footer{padding:12px 16px;border-top:1px solid var(--card-border);}
.btn-settings{
  display:flex;align-items:center;gap:8px;background:none;border:none;
  color:var(--dim);cursor:pointer;font-size:12px;font-family:var(--font);
  padding:6px 0;transition:color .2s;
}
.btn-settings:hover{color:var(--text);}

/* Main */
#main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column;}
#topbar{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;border-bottom:1px solid var(--card-border);
  position:sticky;top:0;z-index:100;background:rgba(13,15,20,0.95);backdrop-filter:blur(10px);
}
#topbar-title{font-family:var(--bebas);font-size:20px;letter-spacing:1px;color:var(--text);}
#topbar-right{display:flex;align-items:center;gap:12px;}
.badge-user{
  font-size:11px;color:var(--dim);background:var(--card);border:1px solid var(--card-border);
  padding:4px 10px;border-radius:20px;
}
#page-content{padding:24px;flex:1;}

/* Cards */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;}
.card-sm{padding:16px;}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:6px;
}
.kpi-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;}
.kpi-val{font-family:var(--bebas);font-size:34px;color:var(--text);line-height:1;}
.kpi-val.cyan{color:var(--cyan);}
.kpi-val.green{color:var(--green);}
.kpi-val.red{color:var(--red);}
.kpi-val.gold{color:var(--gold);}
.kpi-sub{font-size:11px;color:var(--dim);}

/* Section title */
.section-title{font-family:var(--bebas);font-size:18px;letter-spacing:1px;color:var(--text);margin-bottom:14px;}
.section-title span{font-family:var(--font);font-size:13px;font-weight:400;color:var(--dim);margin-left:8px;letter-spacing:0;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;
  border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;
  transition:all .2s;user-select:none;
}
.btn-primary{background:var(--cyan);color:#0d0f14;}
.btn-primary:hover{background:#00bce8;}
.btn-ghost{background:var(--card);border:1px solid var(--card-border);color:var(--text);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn-danger{background:rgba(255,59,48,.15);border:1px solid rgba(255,59,48,.3);color:var(--red);}
.btn-danger:hover{background:rgba(255,59,48,.25);}
.btn-success{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.3);color:var(--green);}
.btn-success:hover{background:rgba(52,211,153,.25);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;}
.btn.loading .spinner{display:block;}
.btn.loading .btn-text{opacity:.6;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Estado badges */
.estado{
  display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
}
.e-PENDIENTE_CORTAR{background:rgba(255,214,10,.15);color:var(--gold);border:1px solid rgba(255,214,10,.3);}
.e-CORTE_POR_ALISTAR{background:rgba(255,159,28,.15);color:#ff9f1c;border:1px solid rgba(255,159,28,.3);}
.e-ASIGNADO{background:rgba(0,212,255,.15);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}
.e-EN_CONFECCION{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.3);}
.e-ENTREGADO_PARCIAL{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.3);}
.e-ENTREGADO{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.e-NOVEDAD{background:rgba(255,59,48,.15);color:var(--red);border:1px solid rgba(255,59,48,.3);}
.e-EN_PROCESO{background:rgba(0,212,255,.15);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}
.e-CERRADA{background:rgba(255,255,255,.08);color:var(--dim);border:1px solid var(--card-border);}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--card-border);}
table{width:100%;border-collapse:collapse;}
th{
  background:rgba(255,255,255,0.04);color:var(--dim);font-size:11px;text-transform:uppercase;
  letter-spacing:.7px;padding:10px 14px;text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--card-border);font-weight:600;
}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.025);}
.text-right{text-align:right;}
.text-center{text-align:center;}

/* Drawer */
#drawer-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;
  backdrop-filter:blur(4px);
}
#drawer-overlay.open{display:block;}
#drawer{
  position:fixed;top:0;right:-440px;width:440px;height:100vh;
  background:#13161f;border-left:1px solid var(--card-border);
  z-index:401;transition:right .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
#drawer.open{right:0;}
#drawer-header{
  padding:18px 20px;border-bottom:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
#drawer-title{font-family:var(--bebas);font-size:18px;letter-spacing:1px;}
#drawer-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;padding:4px;}
#drawer-close:hover{color:var(--text);}
#drawer-body{flex:1;overflow-y:auto;padding:20px;}
#drawer-footer{padding:16px 20px;border-top:1px solid var(--card-border);display:flex;gap:8px;flex-shrink:0;}

/* Modal */
#modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;
  backdrop-filter:blur(6px);align-items:center;justify-content:center;
}
#modal-overlay.open{display:flex;}
#modal{
  background:#13161f;border:1px solid var(--card-border);border-radius:18px;
  width:90%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
}
#modal-header{padding:18px 20px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;}
#modal-title{font-family:var(--bebas);font-size:18px;letter-spacing:1px;}
#modal-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;padding:4px;}
#modal-body{flex:1;overflow-y:auto;padding:20px;}
#modal-footer{padding:16px 20px;border-top:1px solid var(--card-border);display:flex;gap:8px;justify-content:flex-end;}

/* Forms */
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:block;}
.form-control{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);
  border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13px;
  transition:border-color .2s;outline:none;
}
.form-control:focus{border-color:var(--cyan);}
.form-control::placeholder{color:var(--dim);}
select.form-control option{background:#1a1e2a;color:var(--text);}
textarea.form-control{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-error{font-size:11px;color:var(--red);margin-top:4px;}
.form-hint{font-size:11px;color:var(--dim);margin-top:4px;}

/* Toggle */
.toggle{
  appearance:none;width:38px;height:20px;background:rgba(255,255,255,.15);
  border-radius:20px;cursor:pointer;position:relative;transition:background .2s;
  border:none;flex-shrink:0;
}
.toggle::after{
  content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;
  background:#fff;border-radius:50%;transition:transform .2s;
}
.toggle:checked{background:var(--green);}
.toggle:checked::after{transform:translateX(18px);}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--card-border);margin-bottom:16px;}
.tab{
  padding:8px 16px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;user-select:none;
}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}
.tab:hover{color:var(--text);}

/* Toast */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;
  font-size:13px;font-weight:500;min-width:240px;max-width:360px;
  background:#1e2130;border:1px solid var(--card-border);
  animation:toastIn .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.toast.success{border-color:rgba(52,211,153,.3);color:var(--green);}
.toast.error{border-color:rgba(255,59,48,.3);color:var(--red);}
.toast.info{border-color:rgba(0,212,255,.3);color:var(--cyan);}
.toast.warning{border-color:rgba(255,214,10,.3);color:var(--gold);}
@keyframes toastIn{from{transform:translateX(60px);opacity:0;}to{transform:none;opacity:1;}}

/* Satellite cards */
.sat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.sat-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:all .2s;
}
.sat-card:hover{border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.04);}
.sat-card.inactive{opacity:.5;}
.sat-name{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.sat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sat-dot.on{background:var(--green);}
.sat-dot.off{background:var(--red);}
.sat-meta{font-size:12px;color:var(--dim);line-height:1.8;}
.sat-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.sat-tag{
  background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);
  color:var(--cyan);font-size:10px;padding:2px 7px;border-radius:10px;
}

/* Alert card */
.alert-card{
  background:rgba(255,59,48,.06);border:1px solid rgba(255,59,48,.2);
  border-radius:10px;padding:12px 16px;margin-bottom:8px;
}
.alert-card.warning{background:rgba(255,214,10,.06);border-color:rgba(255,214,10,.2);}

/* Progress bar */
.progress{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.progress-bar{height:100%;border-radius:2px;transition:width .5s;}

/* Checkbox */
.ck{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer;}

/* FAB */
.fab{
  position:fixed;bottom:28px;right:28px;z-index:300;
  width:52px;height:52px;border-radius:50%;
  background:var(--cyan);color:#0d0f14;border:none;cursor:pointer;
  font-size:26px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,212,255,.4);transition:all .2s;
}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(0,212,255,.5);}

/* Qty table */
.qty-table{width:100%;border-collapse:collapse;font-size:12px;}
.qty-table th{background:rgba(255,255,255,.05);padding:6px 8px;color:var(--dim);}
.qty-table td{padding:4px 4px;}
.qty-input{
  width:58px;text-align:center;background:rgba(255,255,255,.06);
  border:1px solid var(--card-border);border-radius:6px;
  color:var(--text);padding:4px;font-size:12px;font-family:var(--font);
}
.qty-input:focus{outline:none;border-color:var(--cyan);}

/* Chart bars */
.bar-wrap{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;}
.bar-label{width:130px;color:var(--dim);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--cyan);}
.bar-val{width:40px;color:var(--text);text-align:right;}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--dim);}
.empty-state .icon{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:14px;}

/* Separator */
.sep{height:1px;background:var(--card-border);margin:16px 0;}

/* Filter row */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-row select,.filter-row input{
  background:var(--card);border:1px solid var(--card-border);border-radius:8px;
  color:var(--text);padding:7px 10px;font-size:12px;font-family:var(--font);outline:none;
}
.filter-row select:focus,.filter-row input:focus{border-color:var(--cyan);}

/* Dias chip */
.dias-chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;
}
.dias-ok{background:rgba(52,211,153,.1);color:var(--green);}
.dias-warn{background:rgba(255,214,10,.1);color:var(--gold);}
.dias-late{background:rgba(255,59,48,.1);color:var(--red);}

/* Inline edit */
.editable{border-bottom:1px dashed var(--card-border);cursor:text;outline:none;transition:border-color .2s;}
.editable:focus{border-bottom-color:var(--cyan);}

/* Historial item */
.hist-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
.hist-item:last-child{border-bottom:none;}
.hist-date{color:var(--dim);font-size:11px;}

/* Mobile */
@media(max-width:700px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.mob-open{transform:none;}
  #main{margin-left:0;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  #drawer{width:100%;right:-100%;}
  .form-row{grid-template-columns:1fr;}
  .sat-grid{grid-template-columns:1fr;}
}
#mob-menu{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:0 4px;}
@media(max-width:700px){#mob-menu{display:block;}}
</style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-logo">
    <div class="brand">BENTLEY</div>
    <div class="sub">Producción</div>
  </div>
  <nav>
    <div class="nav-item active" onclick="navTo('dashboard')" data-page="dashboard">
      <span class="icon">⬡</span> Dashboard
    </div>
    <div class="nav-item" onclick="navTo('satelites')" data-page="satelites">
      <span class="icon">🏭</span> Satélites
    </div>
    <div class="nav-item" onclick="navTo('ops')" data-page="ops">
      <span class="icon">📋</span> Órdenes de Producción
    </div>
    <div class="nav-item" onclick="navTo('entregas')" data-page="entregas">
      <span class="icon">📦</span> Entregas
    </div>
    <div class="nav-item" onclick="navTo('indicadores')" data-page="indicadores">
      <span class="icon">📊</span> Indicadores
    </div>
    <div class="nav-item" onclick="navTo('novedades')" data-page="novedades">
      <span class="icon">⚠</span> Novedades <span id="nov-badge" style="display:none;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;"></span>
    </div>
    <div class="nav-item" onclick="navTo('historial')" data-page="historial">
      <span class="icon">📋</span> Historial
    </div>
  </nav>
  <div id="sidebar-footer">
    <button class="btn-settings" onclick="openSettings()">⚙️ <span>Configuración</span></button>
  </div>
</nav>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="mob-menu" onclick="toggleSidebar()">☰</button>
      <div id="topbar-title">DASHBOARD</div>
    </div>
    <div id="topbar-right">
      <span class="badge-user" id="badge-user">Invitado</span>
      <div id="sync-indicator" style="font-size:11px;color:var(--dim);">⬡ Local</div>
    </div>
  </div>
  <div id="page-content"></div>
</div>

<!-- Drawer -->
<div id="drawer-overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div id="drawer-header">
    <div id="drawer-title">Detalle</div>
    <button id="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawer-body"></div>
  <div id="drawer-footer"></div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title">Modal</div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Settings Modal (special) -->
<div id="settings-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;backdrop-filter:blur(6px);align-items:center;justify-content:center;">
  <div style="background:#13161f;border:1px solid var(--card-border);border-radius:18px;width:90%;max-width:440px;padding:24px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div style="font-family:var(--bebas);font-size:18px;letter-spacing:1px;">CONFIGURACIÓN</div>
      <button onclick="closeSettings()" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Tu nombre (usuario)</label>
      <input id="cfg-user" class="form-control" placeholder="Ej: Jhon, Paola..." />
    </div>
    <div class="form-group">
      <label class="form-label">GitHub Token</label>
      <input id="cfg-token" class="form-control" type="password" placeholder="ghp_xxxxxxxxxxxx" />
      <div class="form-hint">Necesario para guardar datos. Se almacena en localStorage.</div>
    </div>
    <div style="margin-top:4px;">
      <button class="btn btn-primary" onclick="saveSettings()" style="width:100%;">Guardar configuración</button>
    </div>
    <div class="sep"></div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:8px;">Datos de la app:</div>
    <div style="display:flex;gap:8px;">

<script>
'use strict';

// ─── Token (obfuscated, XOR 57) ───────────────────────────────────────────────
var _GHE = '5e514966524e5f6168087d4e7f6b080d70607d6d48545c0d0c724953755c727f5100085d0e537d78';

// ─── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type){
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  var icons = {success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
  el.innerHTML = '<span>' + (icons[type]||'') + '</span><span>' + msg + '</span>';
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function(){ el.style.animation = 'none'; el.style.opacity = '0'; el.style.transform = 'translateX(60px)'; el.style.transition = 'all .3s'; setTimeout(function(){ el.remove(); }, 300); }, 3000);
}

// ─── GitHub API ────────────────────────────────────────────────────────────────
var _saving = {};
async function guardarArchivo(key, data){
  if(_saving[key]){ return false; } // evitar doble guardado
  _saving[key] = true;
  var tk = GT || localStorage.getItem('bentley_gh_token') || '';
  if(!tk){ toast('Sin token GitHub', 'error'); _saving[key]=false; return false; }
  var path = FILES[key];
  try {
    // Cache-Control NO se incluye: falla CORS preflight de GitHub API
    var getR = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path + '?t=' + Date.now(), {
      headers: { 'Authorization': 'token ' + tk }
    });
    var sha = null;
    if(getR.ok){ var cur = await getR.json(); sha = cur.sha || null; }
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    var body = { message: 'Produccion Bentley: actualizar ' + key, content: content };
    if(sha) body.sha = sha;
    var putR = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + tk, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    _saving[key] = false;
    if(putR.ok){
      var si = document.getElementById('sync-indicator');
      if(si){ si.textContent = '✓ Sync ' + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); si.style.color = 'var(--green)'; }
      return true;
    } else {
      var err = await putR.json();
      toast('Error GitHub ' + putR.status + ': ' + (err.message||''), 'error');
      return false;
    }
  } catch(e){ _saving[key]=false; toast('Error de red: ' + e.message, 'error'); return false; }
}

async function guardarTodo(){
  var ok1 = await guardarArchivo('satelites', {satelites: DB.satelites});
  var ok2 = await guardarArchivo('ops', {ops: DB.ops});
  var ok3 = await guardarArchivo('ots', {ots: DB.ots});
  return ok1 && ok2 && ok3;
}

// ─── Load Data ─────────────────────────────────────────────────────────────────
async function cargarDatos(){
  try {
    var t = Date.now();
    var [satR, opsR, otsR, catR] = await Promise.all([
      fetch(BASE_URL + 'prod_satelites.json?t=' + t),
      fetch(BASE_URL + 'prod_ops.json?t=' + t),
      fetch(BASE_URL + 'prod_ots.json?t=' + t),
      fetch(BASE_URL + 'prod_catalogo.json?t=' + t)
    ]);
    if(satR.ok){ var d = await satR.json(); DB.satelites = d.satelites || []; }
    if(opsR.ok){ var d2 = await opsR.json(); DB.ops = d2.ops || []; }
    if(otsR.ok){ var d3 = await otsR.json(); DB.ots = d3.ots || []; }
    if(catR.ok){ var d4 = await catR.json(); CATALOGO = d4.catalogo || []; }
    if(DB.satelites.length === 0) seedSatelites();
    saveLocal();
    var msg = 'Datos cargados: ' + DB.ops.length + ' OPs, ' + DB.ots.length + ' OTs, ' + CATALOGO.length + ' refs SKU';
    toast(msg, 'success');
  } catch(e){
    // fallback local
    var local = localStorage.getItem('bentley_prod_db');
    if(local){ var parsed = JSON.parse(local); DB = parsed; }
    else { seedSatelites(); }
    toast('Sin conexión — usando datos locales', 'warning');
  }
  updateNovBadge();
  renderPage(currentPage);
}

async function recargarDatos(){ closeSettings(); await cargarDatos(); }

function saveLocal(){ try{ localStorage.setItem('bentley_prod_db', JSON.stringify(DB)); }catch(e){} }

function seedSatelites(){

  DB.satelites = nombres.map(function(n){ return {id: uid(), nombre: n, activo: true, maquinas: [], personas: 0, especialidades: [], capacidad_semanal: 0, telefono: '', notas: '', created_at: hoy()}; });
}

// ─── Utils ─────────────────────────────────────────────────────────────────────
function hoy(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ if(!d) return '—'; var p = d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function diasRestantes(fechaStr){
  if(!fechaStr) return null;
  var diff = (new Date(fechaStr) - new Date(hoy())) / 86400000;
  return Math.round(diff);
}
function diasChip(dias){
  if(dias === null) return '<span style="color:var(--dim);">—</span>';
  if(dias > 5) return '<span class="dias-chip dias-ok">+' + dias + 'd</span>';
  if(dias >= 0) return '<span class="dias-chip dias-warn">' + dias + 'd</span>';
  return '<span class="dias-chip dias-late">' + Math.abs(dias) + 'd tarde</span>';
}
function badge(estado){ return '<span class="estado e-' + estado + '">' + (ESTADO_LABELS[estado]||estado) + '</span>'; }
function fmtNum(n){ return (n||0).toLocaleString('es-CO'); }
function fmtCop(n){ n=n||0; if(Math.abs(n)>=1e6) return '$'+(n/1e6).toFixed(1)+'M'; if(Math.abs(n)>=1e3) return '$'+(n/1e3).toFixed(0)+'K'; return '$'+n.toFixed(0); }

function getSat(id){ return DB.satelites.find(function(s){ return s.id===id; }); }
function getSatNombre(id){ var s = getSat(id); return s ? s.nombre : '—'; }
function nextOTNum(){ return DB.ots.length > 0 ? Math.max.apply(null, DB.ots.map(function(o){return o.numero_ot||0;})) + 1 : 10001; }
function nextOPNum(){ return DB.ops.length > 0 ? Math.max.apply(null, DB.ops.map(function(o){return o.numero||0;})) + 1 : 100; }

function updateNovBadge(){

// ─── Navigation ────────────────────────────────────────────────────────────────
function navTo(page){

// ═══════════════════════════════════════════════════════════════════════════════
// DASHBOARD

var _dashFiltroMes = '';
function setDashFiltro(mes){ _dashFiltroMes = mes; renderPage('dashboard'); }
function verSateliteDesdeDB(satId){ navTo('satelites'); setTimeout(function(){ abrirSat(satId); }, 100); }

function renderDashboard(){
  var mesActual = hoy().substr(0,7);
  var filtro = _dashFiltroMes;

  // ── Datos base ──────────────────────────────────────────────────────────────
  var activas = DB.ots.filter(function(o){ return o.estado !== 'ENTREGADO'; });
  var enConf  = DB.ots.filter(function(o){ return o.estado === 'EN_CONFECCION'; });

  var entregadasFiltro = DB.ots.filter(function(o){
    if(o.estado !== 'ENTREGADO') return false;
    if(!filtro) return true;
    return (o.fecha_entrega_real||'').startsWith(filtro);
  });
  var udsEntregadas = entregadasFiltro.reduce(function(a,o){ return a+(o.unidades_entregadas||0); },0);

  var conFecha = DB.ots.filter(function(o){ return o.fecha_estimada_entrega && o.fecha_entrega_real && o.estado==='ENTREGADO'; });
  var onTime = conFecha.filter(function(o){ return o.cumplió_fecha; }).length;
  var pct = conFecha.length ? Math.round(onTime/conFecha.length*100) : 0;
  var satActivos = DB.satelites.filter(function(s){ return s.activo; }).length;
  var novedades = DB.ots.filter(function(o){ return o.estado==='NOVEDAD' || (o.unidades_novedad||0)>0; }).length;
  var udsConf = enConf.reduce(function(a,o){ return a+(o.cantidad||0); },0);

  // ── Filter bar ──────────────────────────────────────────────────────────────
  var meses = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  var nomMes = ['Ene','Feb','Mar','Apr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var yearActual = hoy().substr(0,4);
  var h = '';
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;">';
  var allActive = !filtro;
  h += '<button onclick="setDashFiltro(\'\')" style="padding:5px 14px;border-radius:20px;border:1px solid ' + (allActive?'var(--accent)':'var(--card-border)') + ';background:' + (allActive?'var(--accent)':'transparent') + ';color:' + (allActive?'#000':'var(--text)') + ';cursor:pointer;font-size:13px;font-weight:600;">Todo el año</button>';
  meses.forEach(function(m, i){
    var key = yearActual + '-' + m;
    var active = filtro === key;

  // ── KPI row ─────────────────────────────────────────────────────────────────
  h += '<div class="kpi-grid">';

  h += '<div class="kpi-card" style="cursor:pointer;">';
  h += '<div class="kpi-label">Uds Entregadas</div><div class="kpi-val green">' + fmtNum(udsEntregadas) + '</div><div class="kpi-sub">' + (filtro||yearActual) + '</div></div>';
  h += kpiCard('% Cumplimiento', pct + '%', pct>=80?'green':pct>=60?'gold':'red', conFecha.length + ' entregas c/fecha');
  h += '<div class="kpi-card" style="cursor:pointer;" onclick="navTo(\'satelites\')">';
  h += '<div class="kpi-label">Satélites activos</div><div class="kpi-val">' + satActivos + '</div><div class="kpi-sub">De ' + DB.satelites.length + ' total ↗</div></div>';
  h += '<div class="kpi-card" style="cursor:pointer;" onclick="navTo(\'novedades\')">';
  h += '<div class="kpi-label">Novedades activas</div><div class="kpi-val ' + (novedades>0?'red':'') + '">' + novedades + '</div><div class="kpi-sub">Pendientes ↗</div></div>';
  h += '</div>';

  // ── SVG Bar chart "Entregas por mes" ────────────────────────────────────────
  var PL=50,PR=20,PT=20,PB=40,W=700,H=200;
  var mesesChart = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
  var nomChart   = ['Ene','Feb','Mar','Abr','May','Jun'];
  var dataChart  = mesesChart.map(function(m){
    return DB.ots.filter(function(o){ return o.estado==='ENTREGADO' && (o.fecha_entrega_real||'').startsWith(m); }).reduce(function(a,o){ return a+(o.unidades_entregadas||0); },0);
  });
  var maxChart = Math.max.apply(null, dataChart.concat([1]));
  var barW = Math.floor((W - PL - PR) / mesesChart.length);
  var barGap = Math.max(4, Math.floor(barW * 0.25));

  h += '<div class="card" style="margin-top:20px;padding:16px;">';
  h += '<div class="section-title" style="margin-bottom:8px;">Entregas por mes <span>uds entregadas · clic en barra para filtrar</span></div>';

    var x0 = PL + i*barW + barGap/2;
    var bw = barW - barGap;
    var bh = dataChart[i] ? Math.max(4, Math.round((H-PT-PB)*dataChart[i]/maxChart)) : 2;
    var by = H - PB - bh;

    }

  // ── Two-column grid ──────────────────────────────────────────────────────────
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;">';

  // Donut SVG
  var cx2=80,cy2=80,r2=60,ir2=36;
  h += '<div style="display:flex;align-items:center;gap:20px;">';
  h += '<svg viewBox="0 0 160 160" style="width:140px;flex-shrink:0;">';
  var startAngle = -Math.PI/2;
  var keys2 = Object.keys(estadoMap);
  keys2.forEach(function(k){
    var count = estadoMap[k];
    if(!count) return;
    var angle = (count/totalActivas) * 2 * Math.PI;
    var endAngle = startAngle + angle;
    var x1=Math.round(cx2+r2*Math.cos(startAngle)*100)/100, y1=Math.round(cy2+r2*Math.sin(startAngle)*100)/100;
    var x2=Math.round(cx2+r2*Math.cos(endAngle)*100)/100, y2=Math.round(cy2+r2*Math.sin(endAngle)*100)/100;
    var ix1=Math.round(cx2+ir2*Math.cos(startAngle)*100)/100, iy1=Math.round(cy2+ir2*Math.sin(startAngle)*100)/100;
    var ix2=Math.round(cx2+ir2*Math.cos(endAngle)*100)/100, iy2=Math.round(cy2+ir2*Math.sin(endAngle)*100)/100;
    var large = angle > Math.PI ? 1 : 0;
    h += '<path d="M ' + ix1 + ' ' + iy1 + ' L ' + x1 + ' ' + y1 + ' A ' + r2 + ' ' + r2 + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' L ' + ix2 + ' ' + iy2 + ' A ' + ir2 + ' ' + ir2 + ' 0 ' + large + ' 0 ' + ix1 + ' ' + iy1 + ' Z" fill="' + estadoColors[k] + '" opacity="0.85"/>';
    startAngle = endAngle;
  });
  h += '<text x="80" y="76" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="700">' + activas.length + '</text>';
  h += '<text x="80" y="92" text-anchor="middle" fill="var(--dim)" font-size="10">OTs</text>';
  h += '</svg>';
  h += '<div style="flex:1;">';
  keys2.forEach(function(k){
    if(!estadoMap[k]) return;
    h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">';
    h += '<div style="width:10px;height:10px;border-radius:2px;background:' + estadoColors[k] + ';flex-shrink:0;"></div>';
    h += '<div style="font-size:12px;color:var(--text);flex:1;">' + estadoLabels[k] + '</div>';
    h += '<div style="font-size:12px;color:var(--dim);font-weight:600;">' + estadoMap[k] + '</div>';
    h += '</div>';
  });
  h += '</div></div></div>';

  h += '</div>'; // end two-column grid

  // ── Alertas urgentes ─────────────────────────────────────────────────────────
  var alertas = DB.ots.filter(function(o){
    if(o.estado==='ENTREGADO') return false;
    var d = diasRestantes(o.fecha_estimada_entrega);
    return d !== null && d <= 5;
  }).sort(function(a,b){ return (diasRestantes(a.fecha_estimada_entrega)||0)-(diasRestantes(b.fecha_estimada_entrega)||0); });

  if(alertas.length > 0){
    h += '<div class="section-title" style="margin-top:20px;">Alertas urgentes <span>' + alertas.length + ' OTs</span></div>';
    alertas.slice(0,6).forEach(function(ot){
      var d = diasRestantes(ot.fecha_estimada_entrega);
      var cls = d < 0 ? '' : 'warning';
      h += '<div class="alert-card ' + cls + '" data-ot="' + ot.id + '" onclick="verOT(this.dataset.ot)" style="cursor:pointer;">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;">';
      h += '<div><strong>OT-' + ot.numero_ot + '</strong> · ' + ot.nombre + ' ' + ot.color + ' ' + ot.talla + ' (' + ot.cantidad + ' uds)';
      h += ' <span style="color:var(--dim);font-size:12px;">— ' + getSatNombre(ot.satelite_id) + '</span></div>';
      h += diasChip(d);
      h += '</div></div>';
    });
  }

  return h;
}

function kpiCard(label, val, colorClass, sub){
  return '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-val ' + (colorClass||'') + '">' + val + '</div><div class="kpi-sub">' + (sub||'') + '</div></div>';
}

function renderSatelites(){
  var activos = DB.satelites.filter(function(s){ return s.activo; });
  var inactivos = DB.satelites.filter(function(s){ return !s.activo; });
  var all = activos.concat(inactivos);
  var h = '<div class="section-title">Satélites <span>' + activos.length + ' activos</span></div>';
  h += '<div class="sat-grid" id="sat-grid">';
  all.forEach(function(sat){
    var enConf = DB.ots.filter(function(o){ return o.satelite_id===sat.id && o.estado==='EN_CONFECCION'; }).reduce(function(a,o){ return a+(o.cantidad||0); },0);
    var total = DB.ots.filter(function(o){ return o.satelite_id===sat.id && o.estado==='ENTREGADO'; });
    var onTime = total.filter(function(o){ return o.cumplió_fecha; }).length;
    var pct = total.length ? Math.round(onTime/total.length*100) : 0;
    var lastDel = total.sort(function(a,b){ return (b.fecha_entrega_real||'').localeCompare(a.fecha_entrega_real||''); })[0];
    h += '<div class="sat-card ' + (sat.activo?'':'inactive') + '" onclick="abrirSat(\'' + sat.id + '\')">';
    h += '<div class="sat-name"><div class="sat-dot ' + (sat.activo?'on':'off') + '"></div>' + sat.nombre + '</div>';
    h += '<div class="sat-meta">';
    h += (sat.personas||0) + ' personas · ' + (sat.maquinas||[]).reduce(function(a,m){ return a+m.cantidad; },0) + ' máquinas<br>';
    h += 'Carga actual: <strong>' + enConf + ' uds</strong><br>';
    h += 'Cumplimiento: <strong>' + pct + '%</strong> (' + total.length + ' entregas)<br>';
    if(lastDel) h += 'Última entrega: ' + fmtDate(lastDel.fecha_entrega_real);
    h += '</div>';
    if((sat.especialidades||[]).length){
      h += '<div class="sat-tags">' + sat.especialidades.map(function(e){ return '<span class="sat-tag">' + e + '</span>'; }).join('') + '</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  h += '<button class="fab" onclick="nuevoSatelite()" title="Nuevo satélite">+</button>';
  return h;
}

function abrirSat(id){
  var sat = getSat(id);
  if(!sat) return;
  var enConf = DB.ots.filter(function(o){ return o.satelite_id===id && o.estado==='EN_CONFECCION'; });
  var histOTs = DB.ots.filter(function(o){ return o.satelite_id===id; }).sort(function(a,b){ return (b.fecha_ot||'').localeCompare(a.fecha_ot||''); });

  var body = '<div class="tabs"><div class="tab active" onclick="satTab(this,\'ficha\')">Ficha</div><div class="tab" onclick="satTab(this,\'historial\')">Historial (' + histOTs.length + ')</div></div>';

  // Ficha tab
  body += '<div id="sat-tab-ficha">';
  body += '<div class="form-group"><label class="form-label">Nombre</label><input class="form-control" id="se-nombre" value="' + esc(sat.nombre) + '"></div>';
  body += '<div class="form-group"><div style="display:flex;align-items:center;justify-content:space-between;"><label class="form-label">Activo</label><input type="checkbox" class="toggle" id="se-activo" ' + (sat.activo?'checked':'') + '></div></div>';
  body += '<div class="form-row"><div class="form-group"><label class="form-label">Personas</label><input class="form-control" type="number" id="se-personas" value="' + (sat.personas||0) + '"></div><div class="form-group"><label class="form-label">Cap. semanal (uds)</label><input class="form-control" type="number" id="se-cap" value="' + (sat.capacidad_semanal||0) + '"></div></div>';
  body += '<div class="form-group"><label class="form-label">Teléfono</label><input class="form-control" id="se-tel" value="' + esc(sat.telefono||'') + '"></div>';
  body += '<div class="form-group"><label class="form-label">Especialidades</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">' + CATEGORIAS.map(function(c){ return '<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;"><input type="checkbox" class="se-esp" value="' + c + '" ' + (sat.especialidades&&sat.especialidades.indexOf(c)>-1?'checked':'') + '> ' + c + '</label>'; }).join('') + '</div></div>';
  // Maquinas
  body += '<div class="form-group"><label class="form-label">Máquinas <button class="btn btn-ghost btn-sm" onclick="addMaquina()" style="margin-left:8px;">+ Añadir</button></label>';
  body += '<div id="maquinas-list">';
  (sat.maquinas||[]).forEach(function(m, i){
    body += '<div class="form-row" style="margin-bottom:6px;"><div><input class="form-control maq-tipo" placeholder="Tipo" value="' + esc(m.tipo) + '"></div><div><input class="form-control maq-cant" type="number" placeholder="Cant" value="' + m.cantidad + '"></div></div>';
  });
  body += '</div></div>';
  body += '<div class="form-group"><label class="form-label">Notas</label><textarea class="form-control" id="se-notas">' + esc(sat.notas||'') + '</textarea></div>';

  // Carga actual
  if(enConf.length){
    body += '<div class="sep"></div><div class="section-title" style="font-size:15px;">Carga actual</div>';
    body += '<div class="table-wrap"><table><thead><tr><th>OT</th><th>Producto</th><th>Uds</th><th>Fecha Est.</th></tr></thead><tbody>';
    enConf.forEach(function(ot){
      body += '<tr><td>OT-' + ot.numero_ot + '</td><td>' + ot.nombre + ' ' + ot.color + ' ' + ot.talla + '</td><td>' + ot.cantidad + '</td><td>' + fmtDate(ot.fecha_estimada_entrega) + '</td></tr>';
    });
    body += '</tbody></table></div>';
  }
  body += '</div>'; // ficha tab

  // Historial tab
  body += '<div id="sat-tab-historial" style="display:none;">';
  if(histOTs.length){
    body += '<div class="table-wrap"><table><thead><tr><th>OT</th><th>Producto</th><th>Estado</th><th>Uds</th><th>Entregado</th></tr></thead><tbody>';
    histOTs.slice(0,50).forEach(function(ot){
      body += '<tr><td>OT-' + ot.numero_ot + '</td><td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ot.nombre + '</td><td>' + badge(ot.estado) + '</td><td>' + (ot.unidades_entregadas||0) + '</td><td>' + fmtDate(ot.fecha_entrega_real) + '</td></tr>';
    });
    body += '</tbody></table></div>';
  } else { body += '<div style="color:var(--dim);padding:20px 0;">Sin historial.</div>'; }
  body += '</div>';

  var footer = '<button class="btn btn-primary" onclick="guardarSat(\'' + id + '\')"><span class="btn-text">💾 Guardar</span><span class="spinner"></span></button><button class="btn btn-ghost" onclick="closeDrawer()">Cancelar</button>';
  openDrawer(sat.nombre, body, footer);
}

function satTab(el, tab){
  document.querySelectorAll('.tabs .tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('sat-tab-ficha').style.display = tab==='ficha' ? '' : 'none';
  document.getElementById('sat-tab-historial').style.display = tab==='historial' ? '' : 'none';
}

function addMaquina(){
  var list = document.getElementById('maquinas-list');
  var div = document.createElement('div');
  div.className = 'form-row';
  div.style.marginBottom = '6px';
  div.innerHTML = '<div><input class="form-control maq-tipo" placeholder="Tipo (ej: Plana)"></div><div><input class="form-control maq-cant" type="number" placeholder="Cant" value="1"></div>';
  list.appendChild(div);
}

async function guardarSat(id){
  var sat = getSat(id);
  if(!sat) return;
  sat.nombre = document.getElementById('se-nombre').value.trim() || sat.nombre;
  sat.activo = document.getElementById('se-activo').checked;
  sat.personas = parseInt(document.getElementById('se-personas').value)||0;
  sat.capacidad_semanal = parseInt(document.getElementById('se-cap').value)||0;
  sat.telefono = document.getElementById('se-tel').value.trim();
  sat.notas = document.getElementById('se-notas').value;
  sat.especialidades = Array.from(document.querySelectorAll('.se-esp:checked')).map(function(c){ return c.value; });
  var tipos = document.querySelectorAll('.maq-tipo');
  var cants = document.querySelectorAll('.maq-cant');
  sat.maquinas = [];
  for(var i=0;i<tipos.length;i++){
    var t = tipos[i].value.trim();
    if(t) sat.maquinas.push({tipo:t, cantidad:parseInt(cants[i].value)||1});
  }
  setBtnLoading('guardar-sat-btn', true);
  saveLocal();
  var ok = await guardarArchivo('satelites', {satelites: DB.satelites});
  if(ok){ toast('Satélite guardado', 'success'); closeDrawer(); renderPage('satelites'); }
}

function nuevoSatelite(){
  var body = '<div class="form-group"><label class="form-label">Nombre del satélite *</label><input class="form-control" id="ns-nombre" placeholder="Ej: SOFIA SANCHEZ"></div>';
  body += '<div class="form-row"><div class="form-group"><label class="form-label">Personas</label><input class="form-control" type="number" id="ns-personas" value="0"></div><div class="form-group"><label class="form-label">Cap. semanal</label><input class="form-control" type="number" id="ns-cap" value="0"></div></div>';
  body += '<div class="form-group"><label class="form-label">Teléfono</label><input class="form-control" id="ns-tel"></div>';
  body += '<div class="form-group"><label class="form-label">Especialidades</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">' + CATEGORIAS.map(function(c){ return '<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;"><input type="checkbox" class="ns-esp" value="' + c + '"> ' + c + '</label>'; }).join('') + '</div></div>';
  var footer = '<button class="btn btn-primary" onclick="crearSatelite()">✚ Crear satélite</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>';
  openModal('Nuevo Satélite', body, footer);
}

async function crearSatelite(){
  var nombre = document.getElementById('ns-nombre').value.trim().toUpperCase();
  if(!nombre){ document.getElementById('ns-nombre').style.borderColor='var(--red)'; return; }
  var sat = {
    id: uid(), nombre: nombre, activo: true,
    personas: parseInt(document.getElementById('ns-personas').value)||0,
    capacidad_semanal: parseInt(document.getElementById('ns-cap').value)||0,
    telefono: document.getElementById('ns-tel').value.trim(),
    especialidades: Array.from(document.querySelectorAll('.ns-esp:checked')).map(function(c){ return c.value; }),
    maquinas: [], notas: '', created_at: hoy()
  };
  DB.satelites.push(sat);
  saveLocal();
  var ok = await guardarArchivo('satelites', {satelites: DB.satelites});
  if(ok){ toast('Satélite creado', 'success'); closeModal(); renderPage('satelites'); }
}

// ÓRDENES DE PRODUCCIÓN (lista)
// ═══════════════════════════════════════════════════════════════════════════════
function renderOPs(){
  var ops = DB.ops.slice().reverse(); // más recientes primero... wait, en orden de creación
  ops = DB.ops.slice(); // orden de creación
  var h = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">';
  h += '<div style="font-size:13px;color:var(--dim);">' + ops.length + ' órdenes de producción</div>';
  h += '<button class="btn btn-primary btn-sm" onclick="mostrarFormNuevaOP()">✚ Nueva OP</button>';
  h += '</div>';

  if(!ops.length){
    h += '<div class="empty-state"><div style="font-size:40px;margin-bottom:12px;">📋</div><div>No hay órdenes de producción</div><div style="color:var(--dim);font-size:13px;margin-top:6px;">Crea la primera OP con el botón de arriba</div></div>';
    return h;
  }

  // Agrupar OTs por OP
  var otsXop = {};
  DB.ots.forEach(function(ot){ if(ot.op_id){ (otsXop[ot.op_id]=otsXop[ot.op_id]||[]).push(ot); } });

  h += '<div style="display:flex;flex-direction:column;gap:10px;">';
  ops.forEach(function(op){
    var otsOp = otsXop[op.id] || [];
    var udsTotal = otsOp.reduce(function(a,o){ return a+(o.cantidad||0); }, 0);
    var udsEntregadas = otsOp.filter(function(o){ return o.estado==='ENTREGADO'; }).reduce(function(a,o){ return a+(o.unidades_entregadas||0); }, 0);
    var enConf = otsOp.filter(function(o){ return o.estado==='EN_CONFECCION'; }).length;
    var pct = udsTotal ? Math.round(udsEntregadas/udsTotal*100) : 0;

    var estadoColor = {
      'EN_PROCESO':'var(--accent)',
      'COMPLETADO':'var(--green)',
      'CON_NOVEDAD':'var(--red)'
    }[op.estado_op] || 'var(--dim)';

    h += '<div class="card" style="padding:16px 18px;cursor:pointer;" onclick="verDetalleOP(\'' + op.id + '\')">';
    h += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">';
    h += '<div style="min-width:90px;"><div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;">OP</div><div style="font-size:18px;font-weight:700;color:var(--accent);">' + op.id + '</div></div>';
    h += '<div style="flex:1;min-width:180px;"><div style="font-size:15px;font-weight:600;">' + op.nombre_producto + '</div><div style="font-size:12px;color:var(--dim);margin-top:2px;">' + op.categoria + (op.colores && op.colores.length ? ' · ' + op.colores.join(', ') : '') + '</div></div>';
    h += '<div style="text-align:center;min-width:80px;"><div style="font-size:11px;color:var(--dim);">UNIDADES</div><div style="font-size:17px;font-weight:700;">' + udsTotal.toLocaleString('es-CO') + '</div></div>';
    h += '<div style="text-align:center;min-width:80px;"><div style="font-size:11px;color:var(--dim);">ENTREGADO</div><div style="font-size:17px;font-weight:700;color:var(--green);">' + pct + '%</div></div>';
    h += '<div style="text-align:center;min-width:70px;"><div style="font-size:11px;color:var(--dim);">EN CONF.</div><div style="font-size:17px;font-weight:700;">' + enConf + '</div></div>';
    h += '<div style="min-width:110px;"><span style="background:' + estadoColor + '22;color:' + estadoColor + ';border:1px solid ' + estadoColor + '44;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;">' + (op.estado_op||'EN_PROCESO') + '</span></div>';
    h += '<div style="font-size:12px;color:var(--dim);white-space:nowrap;">' + fmtDate(op.fecha_op) + '</div>';
    h += '</div>';
    // barra progreso
    h += '<div style="margin-top:10px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:var(--green);border-radius:4px;transition:width .4s;"></div></div>';
    h += '</div>';
  });
  h += '</div>';

  return h;
}

function mostrarFormNuevaOP(){

function renderOPDetalle(opId){
  var op = DB.ops.find(function(o){ return o.id === opId; });
  if(!op) return '<div class="empty-state">OP no encontrada</div>';

  var otsOp = DB.ots.filter(function(o){ return o.op_id === opId; });
  var udsTotal    = otsOp.reduce(function(a,o){ return a+(o.cantidad||0); }, 0);
  var otsEnt      = otsOp.filter(function(o){ return o.estado==='ENTREGADO'; });
  var otsConf     = otsOp.filter(function(o){ return o.estado==='EN_CONFECCION'; });
  var otsPCorte   = otsOp.filter(function(o){ return o.estado==='PENDIENTE_CORTAR'||o.estado==='CORTE_POR_ALISTAR'; });
  var otsNov      = otsOp.filter(function(o){ return o.estado==='NOVEDAD'||(o.unidades_novedad||0)>0; });
  var udsEnt      = otsEnt.reduce(function(a,o){ return a+(o.unidades_entregadas||0); }, 0);
  var udsConf     = otsConf.reduce(function(a,o){ return a+(o.cantidad||0); }, 0);
  var udsPCorte   = otsPCorte.reduce(function(a,o){ return a+(o.cantidad||0); }, 0);
  var pct = udsTotal ? Math.round(udsEnt/udsTotal*100) : 0;
  var edit = _opEditMode;

  var estadoColor = {'EN_PROCESO':'var(--accent)','COMPLETADO':'var(--green)','CON_NOVEDAD':'var(--red)'}[op.estado_op]||'var(--dim)';

  var h = '';
  // ── Cabecera ──
  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">';
  h += '<button onclick="volverAOPs()" style="background:rgba(255,255,255,.08);border:1px solid var(--card-border);border-radius:8px;color:var(--text);padding:8px 14px;cursor:pointer;font-size:14px;">← Volver</button>';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;">Orden de Producción</div>';
  h += '<div style="font-size:20px;font-weight:700;color:var(--accent);">' + op.id + ' <span style="color:var(--text);font-size:17px;">— ' + op.nombre_producto + '</span></div>';
  h += '</div>';
  h += '<span style="background:' + estadoColor + '22;color:' + estadoColor + ';border:1px solid ' + estadoColor + '44;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;">' + (op.estado_op||'EN_PROCESO') + '</span>';
  if(!edit){
    h += '<button onclick="activarEdicionOP()" style="background:rgba(255,200,0,.12);border:1px solid rgba(255,200,0,.35);color:#ffc800;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;">✏ Editar OP</button>';
  } else {
    h += '<button onclick="guardarEdicionOP()" id="btn-guardar-ed" style="background:rgba(0,212,100,.15);border:1px solid rgba(0,212,100,.4);color:var(--green);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;">💾 Guardar</button>';
    h += '<button onclick="cancelarEdicionOP()" style="background:rgba(255,255,255,.06);border:1px solid var(--card-border);color:var(--dim);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;">Cancelar</button>';
  }
  h += '</div>';

  // ── KPIs interactivos ──
  function kpiCard(label, val, color, filterFn, filterLabel){
    var clickable = filterFn ? 'cursor:pointer;' : '';
    var hover = filterFn ? 'onmouseenter="this.style.borderColor=\'' + color + '\'" onmouseleave="this.style.borderColor=\'var(--card-border)\'"' : '';
    var click = filterFn ? 'onclick="mostrarKPIDetalle(\'' + opId + '\',\'' + filterLabel + '\')"' : '';
    return '<div class="card" style="padding:12px 14px;' + clickable + 'transition:border-color .2s;" ' + hover + ' ' + click + '>' +
      '<div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">' + label + (filterFn?'&nbsp;<span style="font-size:9px;opacity:.5;">▶ ver</span>':'') + '</div>' +
      '<div style="font-size:18px;font-weight:700;color:' + color + ';">' + val + '</div>' +
      '</div>';
  }
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;">';
  h += kpiCard('TOTAL UDS', udsTotal.toLocaleString('es-CO'), 'var(--text)', null, '');
  h += kpiCard('ENTREGADO', udsEnt.toLocaleString('es-CO') + ' (' + pct + '%)', 'var(--green)', true, 'ENTREGADO');
  h += kpiCard('EN CONFECCIÓN', udsConf.toLocaleString('es-CO'), 'var(--accent)', true, 'EN_CONFECCION');
  h += kpiCard('PTE. CORTE', udsPCorte.toLocaleString('es-CO'), '#ffc800', true, 'CORTE');
  if(otsNov.length) h += kpiCard('NOVEDADES', otsNov.length + ' OTs', 'var(--red)', true, 'NOVEDAD');
  h += kpiCard('CORTADOR', op.cortador||'—', 'var(--text)', null, '');
  h += kpiCard('FECHA OP', fmtDate(op.fecha_op), 'var(--dim)', null, '');
  h += '</div>';

  // Barra progreso
  h += '<div style="height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-bottom:22px;">';
  h += '<div style="height:100%;width:' + pct + '%;background:var(--green);border-radius:6px;transition:width .4s;"></div></div>';

  // ── OTs agrupadas por COLOR ──
  var colores = {};
  otsOp.forEach(function(ot){ var c = ot.color||'—'; if(!colores[c]) colores[c]=[]; colores[c].push(ot); });
  var ESTADO_ORDER = ['PENDIENTE_CORTAR','CORTE_POR_ALISTAR','ASIGNADO','EN_CONFECCION','ENTREGADO_PARCIAL','NOVEDAD','ENTREGADO'];
  var satOpts = DB.satelites.filter(function(s){ return s.activo; }).map(function(s){ return '<option value="' + s.id + '">' + s.nombre + '</option>'; }).join('');

  Object.keys(colores).forEach(function(color){
    var otsC = colores[color].sort(function(a,b){ return ESTADO_ORDER.indexOf(a.estado)-ESTADO_ORDER.indexOf(b.estado); });
    var udsC = otsC.reduce(function(a,o){ return a+(o.cantidad||0); }, 0);
    var udsEC = otsC.filter(function(o){ return o.estado==='ENTREGADO'; }).reduce(function(a,o){ return a+(o.unidades_entregadas||0); }, 0);
    var pctC = udsC ? Math.round(udsEC/udsC*100) : 0;

    h += '<div class="card" style="margin-bottom:12px;padding:0;overflow:hidden;">';
    h += '<div style="padding:11px 16px;background:rgba(255,255,255,.04);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--card-border);">';
    h += '<div style="font-size:14px;font-weight:700;flex:1;">🎨 ' + color + '</div>';
    h += '<div style="font-size:12px;color:var(--dim);">' + otsC.length + ' OTs · ' + udsC + ' uds · <span style="color:var(--green);">' + pctC + '% entregado</span></div>';
    h += '</div>';
    h += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    h += '<thead><tr style="background:rgba(255,255,255,.02);">';
    var ths = ['OT #','Talla','Cant.','Estado','Satélite','Entregado','F. Est.','Días'];
    if(!edit) ths.push('Acción');
    ths.forEach(function(t,i){
      var align = (i>=2 && i<=7) ? 'center' : 'left';
      h += '<th style="padding:8px 12px;text-align:' + align + ';color:var(--dim);font-weight:500;font-size:11px;white-space:nowrap;">' + t + '</th>';
    });
    h += '</tr></thead><tbody>';

    otsC.forEach(function(ot, idx){
      var dias = diasRestantes(ot.fecha_estimada_entrega);
      var rowBg = idx%2===0 ? '' : 'background:rgba(255,255,255,.015);';
      h += '<tr style="border-top:1px solid rgba(255,255,255,.04);' + rowBg + '">';
      h += '<td style="padding:10px 12px;font-weight:700;color:var(--cyan);white-space:nowrap;">OT-' + ot.numero_ot + '</td>';
      h += '<td style="padding:10px 12px;font-weight:600;">' + (ot.talla||'—') + '</td>';
      // Cantidad — editable en modo edición
      if(edit){
        h += '<td style="padding:6px 8px;text-align:center;"><input type="number" min="0" data-otid="' + ot.id + '" data-field="cantidad" value="' + (ot.cantidad||0) + '" style="width:60px;text-align:center;background:rgba(255,200,0,.1);border:1px solid rgba(255,200,0,.4);border-radius:6px;color:var(--text);padding:4px 6px;font-size:13px;"></td>';
      } else {
        h += '<td style="padding:10px 12px;text-align:center;">' + (ot.cantidad||0) + '</td>';
      }
      h += '<td style="padding:10px 12px;">' + badge(ot.estado) + '</td>';
      // Satélite — editable en modo edición
      if(edit){
        h += '<td style="padding:6px 8px;"><select data-otid="' + ot.id + '" data-field="satelite_id" style="background:rgba(255,200,0,.1);border:1px solid rgba(255,200,0,.4);border-radius:6px;color:var(--text);padding:4px 6px;font-size:12px;width:100%;"><option value="">Sin asignar</option>' + satOpts.replace('value="' + ot.satelite_id + '"','value="' + ot.satelite_id + '" selected') + '</select></td>';
      } else {
        h += '<td style="padding:10px 12px;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + getSatNombre(ot.satelite_id) + '</td>';
      }
      h += '<td style="padding:10px 12px;text-align:center;color:var(--green);font-weight:600;">' + (ot.unidades_entregadas||0) + '</td>';
      h += '<td style="padding:10px 12px;text-align:center;font-size:12px;color:var(--dim);">' + (ot.fecha_estimada_entrega?fmtDate(ot.fecha_estimada_entrega):'—') + '</td>';
      h += '<td style="padding:10px 12px;text-align:center;">' + diasChip(dias) + '</td>';
      if(!edit){
        h += '<td style="padding:10px 12px;text-align:center;"><button onclick="abrirOT(\'' + ot.id + '\')" style="background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;">Ver / Editar</button></td>';
      }
      h += '</tr>';
    });
    h += '</tbody></table></div></div>';
  });

  if(edit){
    h += '<div style="padding:16px 0;display:flex;gap:10px;">';
    h += '<button onclick="guardarEdicionOP()" id="btn-guardar-ed2" style="background:rgba(0,212,100,.15);border:1px solid rgba(0,212,100,.4);color:var(--green);border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px;font-weight:600;">💾 Guardar cambios</button>';
    h += '<button onclick="cancelarEdicionOP()" style="background:rgba(255,255,255,.06);border:1px solid var(--card-border);color:var(--dim);border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px;">Cancelar</button>';
    h += '</div>';
  }
  return h;
}

// ── KPI detalle modal ────────────────────────────────────────────────────────
function mostrarKPIDetalle(opId, filtro){
  var otsOp = DB.ots.filter(function(o){ return o.op_id === opId; });
  var lista;
  var titulo;
  if(filtro==='ENTREGADO'){
    lista = otsOp.filter(function(o){ return o.estado==='ENTREGADO'; });
    titulo = 'Unidades Entregadas';
  } else if(filtro==='EN_CONFECCION'){
    lista = otsOp.filter(function(o){ return o.estado==='EN_CONFECCION'; });
    titulo = 'En Confección';
  } else if(filtro==='CORTE'){
    lista = otsOp.filter(function(o){ return o.estado==='PENDIENTE_CORTAR'||o.estado==='CORTE_POR_ALISTAR'; });
    titulo = 'Pendiente de Corte';
  } else if(filtro==='NOVEDAD'){
    lista = otsOp.filter(function(o){ return o.estado==='NOVEDAD'||(o.unidades_novedad||0)>0; });
    titulo = 'Con Novedad';
  } else { return; }

  if(!lista.length){ toast('No hay OTs en este estado', 'warning'); return; }

  // Agrupar por satélite
  var porSat = {};
  lista.forEach(function(ot){
    var sn = getSatNombre(ot.satelite_id);
    if(!porSat[sn]) porSat[sn] = [];
    porSat[sn].push(ot);
  });

  var udsTotal = lista.reduce(function(a,o){ return a+(filtro==='ENTREGADO'?(o.unidades_entregadas||0):(o.cantidad||0)); }, 0);

  var body = '<div style="font-size:13px;color:var(--dim);margin-bottom:14px;">' + lista.length + ' OTs · ' + udsTotal + ' unidades</div>';

  Object.keys(porSat).sort().forEach(function(sat){
    var otsS = porSat[sat];
    var udsSat = otsS.reduce(function(a,o){ return a+(filtro==='ENTREGADO'?(o.unidades_entregadas||0):(o.cantidad||0)); }, 0);
    body += '<div style="margin-bottom:14px;">';
    body += '<div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--card-border);">🏭 ' + sat + ' <span style="color:var(--dim);font-weight:400;font-size:12px;">(' + udsSat + ' uds)</span></div>';
    body += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    body += '<thead><tr><th style="text-align:left;padding:4px 8px;color:var(--dim);font-weight:500;">OT</th><th style="text-align:left;padding:4px 8px;color:var(--dim);font-weight:500;">Color</th><th style="padding:4px 8px;color:var(--dim);font-weight:500;">Talla</th><th style="padding:4px 8px;color:var(--dim);font-weight:500;">Uds</th><th style="padding:4px 8px;color:var(--dim);font-weight:500;">Estado</th></tr></thead><tbody>';
    otsS.forEach(function(ot){
      var uds = filtro==='ENTREGADO' ? (ot.unidades_entregadas||0) : (ot.cantidad||0);
      body += '<tr style="border-top:1px solid rgba(255,255,255,.04);">';
      body += '<td style="padding:6px 8px;color:var(--cyan);font-weight:600;">OT-' + ot.numero_ot + '</td>';
      body += '<td style="padding:6px 8px;">' + (ot.color||'—') + '</td>';
      body += '<td style="padding:6px 8px;text-align:center;">' + (ot.talla||'—') + '</td>';
      body += '<td style="padding:6px 8px;text-align:center;font-weight:700;">' + uds + '</td>';
      body += '<td style="padding:6px 8px;">' + badge(ot.estado) + '</td>';
      body += '</tr>';
    });
    body += '</tbody></table></div>';
  });

  openModal(titulo.toUpperCase(), body, '');
}

// ── Edición de OP ────────────────────────────────────────────────────────────
function activarEdicionOP(){
  _opEditMode = true;
  document.getElementById('page-content').innerHTML = renderOPDetalle(_opDetalleId);
}
function cancelarEdicionOP(){
  _opEditMode = false;
  document.getElementById('page-content').innerHTML = renderOPDetalle(_opDetalleId);
}
async function guardarEdicionOP(){
  // Recoger todos los cambios de cantidad y satélite
  var cantInputs = document.querySelectorAll('[data-field="cantidad"]');
  var satSelects = document.querySelectorAll('[data-field="satelite_id"]');
  var cambios = 0;
  cantInputs.forEach(function(inp){
    var ot = DB.ots.find(function(o){ return o.id===inp.dataset.otid; });
    if(ot){ var nv = parseInt(inp.value)||0; if(nv!==ot.cantidad){ ot.cantidad=nv; cambios++; } }
  });
  satSelects.forEach(function(sel){
    var ot = DB.ots.find(function(o){ return o.id===sel.dataset.otid; });
    if(ot){ var nv=sel.value||null; if(nv!==ot.satelite_id){ ot.satelite_id=nv; cambios++; } }
  });

  if(!cambios){ toast('Sin cambios', 'warning'); cancelarEdicionOP(); return; }

  // Actualizar estado de OP
  var op = DB.ops.find(function(o){ return o.id===_opDetalleId; });
  if(op) op.updated_at = hoy();

  saveLocal();
  toast('Guardando ' + cambios + ' cambios...', 'success');
  var ok1 = await guardarArchivo('ots', {ots: DB.ots});
  var ok2 = await guardarArchivo('ops', {ops: DB.ops});
  _opEditMode = false;
  if(ok1&&ok2) toast('Cambios guardados', 'success');
  document.getElementById('page-content').innerHTML = renderOPDetalle(_opDetalleId);
}

  var h = '';

  h += '<div class="form-group"><label class="form-label">Categoría *</label><select class="form-control" id="op-cat" onchange="actualizarPreview()"><option value="">Seleccionar...</option>' + CATEGORIAS.map(function(c){ return '<option>' + c + '</option>'; }).join('') + '</select></div>';

  h += '<div id="sku-sugerencias" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:200;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);"></div>';

  h += '<div class="form-group"><label class="form-label">Referencia base (código)</label><input class="form-control" id="op-ref" placeholder="Ej: 1001" readonly style="background:rgba(255,255,255,.04);color:var(--dim);"></div>';
  h += '<div class="form-group"><label class="form-label">Valor M.O. por unidad (COP)</label><input class="form-control" type="number" id="op-vmo" placeholder="Ej: 1151" value="1151"></div>';

  // Colores
  h += '<div class="form-group"><label class="form-label">Colores * <button type="button" class="btn btn-ghost btn-sm" onclick="addColor()" style="margin-left:8px;">+ Color manual</button></label>';
  h += '<div id="colores-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:32px;"></div>';
  h += '<div style="display:flex;gap:6px;margin-top:8px;"><input class="form-control" id="color-input" placeholder="Ej: NEGRO" style="max-width:200px;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addColor();}"><button type="button" class="btn btn-ghost btn-sm" onclick="addColor()">Añadir</button></div></div>';

  // Tallas
  h += '<div class="form-group"><label class="form-label">Tallas</label><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">';
  h += TALLAS_ALL.map(function(t){ return '<label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;"><input type="checkbox" class="ck op-talla" value="' + t + '" ' + (TALLAS_DEFAULT.indexOf(t)>-1?'checked':'') + ' onchange="generarTablaQty()"> ' + t + '</label>'; }).join('');
  h += '</div></div>';

  h += '<div class="sep"></div>';

// ─── Catálogo SKU autocompletado ────────────────────────────────────────────
var _catItemSeleccionado = null;

function buscarEnCatalogo(val){
  actualizarPreview();
  var q = val.trim().toUpperCase();
  var box = document.getElementById('sku-sugerencias');
  if(!box) return;
  if(!q || q.length < 2){ box.style.display='none'; return; }
  var matches = CATALOGO.filter(function(r){ return r.ref.toUpperCase().indexOf(q) > -1; }).slice(0, 12);
  if(!matches.length){ box.style.display='none'; return; }
  box.innerHTML = matches.map(function(r){
    var colores = r.colores.map(function(c){ return c.n; }).join(', ');
    var tallas = r.colores.length ? r.colores[0].tallas.map(function(t){ return t.t; }).join(' ') : '';
    return '<div style="padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);" ' +
      'data-ref="' + r.ref + '" data-cod="' + r.cod + '" data-cat="' + r.cat + '" ' +
      'onmousedown="seleccionarDelCatalogo(this)">' +
      '<div style="font-size:13px;font-weight:600;">' + r.ref + '</div>' +
      '<div style="font-size:11px;color:var(--dim);margin-top:2px;">Cód: ' + r.cod + ' · ' + colores + '</div>' +
      '<div style="font-size:10px;color:var(--dim);margin-top:1px;">' + tallas + '</div>' +
      '</div>';
  }).join('');
  box.style.display = 'block';
}

function seleccionarDelCatalogo(el){
  var ref = el.dataset.ref;
  var cod = el.dataset.cod;
  var cat = el.dataset.cat;
  var inpNombre = document.getElementById('op-nombre');
  var inpRef = document.getElementById('op-ref');
  var selCat = document.getElementById('op-cat');
  if(inpNombre) inpNombre.value = ref;
  if(inpRef) inpRef.value = cod;

  // Buscar el item completo en el catálogo
  _catItemSeleccionado = CATALOGO.find(function(r){ return r.ref === ref; }) || null;

  // Auto-cargar colores del catálogo
  if(_catItemSeleccionado){
    _colores = _catItemSeleccionado.colores.map(function(c){ return c.n; });
    renderColoresTags();
    generarTablaQty();
  }

  ocultarSugerencias();
  actualizarPreview();
}

function ocultarSugerencias(){
  var box = document.getElementById('sku-sugerencias');
  if(box) box.style.display = 'none';
}

var _colores = [];
function addColor(){
  var input = document.getElementById('color-input');
  var v = (input ? input.value.trim().toUpperCase() : '');
  if(!v) return;
  if(_colores.indexOf(v)>-1){ toast('Color ya añadido','warning'); return; }
  _colores.push(v);
  input.value = '';
  renderColoresTags();
  generarTablaQty();
}
function removeColor(c){
  _colores = _colores.filter(function(x){ return x!==c; });
  renderColoresTags();
  generarTablaQty();
}
function renderColoresTags(){
  var el = document.getElementById('colores-list');
  if(!el) return;
  el.innerHTML = _colores.map(function(c){ return '<span style="background:rgba(255,255,255,.08);border:1px solid var(--card-border);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;">' + c + ' <span onclick="removeColor(\'' + c + '\')" style="cursor:pointer;color:var(--red);">✕</span></span>'; }).join('');
}

function generarTablaQty(){
  var wrap = document.getElementById('qty-table-wrap');
  if(!wrap) return;
  var tallas = Array.from(document.querySelectorAll('.op-talla:checked')).map(function(c){ return c.value; });
  if(!_colores.length || !tallas.length){ wrap.innerHTML = '<div style="color:var(--dim);font-size:13px;padding:12px 0;">Añade colores y tallas para ver la tabla.</div>'; return; }
  var h = '<table class="qty-table"><thead><tr><th>Color</th>' + tallas.map(function(t){ return '<th>' + t + '</th>'; }).join('') + '<th>Total</th></tr></thead><tbody>';
  _colores.forEach(function(col){
    h += '<tr><td style="font-weight:600;white-space:nowrap;padding:4px 8px;">' + col + '</td>';
    tallas.forEach(function(t){
      var key = 'qty_' + col + '_' + t;
      var existing = document.querySelector('[data-key="' + key + '"]');
      var val = existing ? existing.value : '0';
      h += '<td><input class="qty-input" type="number" min="0" data-color="' + col + '" data-talla="' + t + '" data-key="' + key + '" value="' + val + '" oninput="actualizarPreview()"></td>';
    });
    h += '<td class="tot-' + col + '" style="font-weight:600;text-align:center;">0</td>';
    h += '</tr>';
  });
  h += '</tbody></table>';
  wrap.innerHTML = h;
  actualizarPreview();
}

function actualizarPreview(){
  // update row totals
  _colores.forEach(function(col){
    var inps = document.querySelectorAll('[data-color="' + col + '"]');
    var tot = 0;
    inps.forEach(function(i){ tot += parseInt(i.value)||0; });
    var cell = document.querySelector('.tot-' + CSS.escape(col));
    if(cell) cell.textContent = tot;
  });
  // count OTs
  var totalOTs = 0;
  var totalUds = 0;
  document.querySelectorAll('.qty-input').forEach(function(inp){
    var v = parseInt(inp.value)||0;
    if(v > 0){ totalOTs++; totalUds += v; }
  });
  var prev = document.getElementById('op-preview');
  if(!prev) return;
  var nombre = (document.getElementById('op-nombre')||{}).value || '';
  if(totalOTs > 0 && nombre){
    prev.style.display = '';
    prev.innerHTML = '📋 Se crearán <strong>' + totalOTs + ' órdenes de trabajo</strong> para <strong>' + nombre + '</strong> · Total: <strong>' + totalUds + ' unidades</strong>';
  } else { prev.style.display = 'none'; }
}

async function crearOP(){
  // Validations
  var fecha = (document.getElementById('op-fecha')||{}).value;
  var numOp = parseInt((document.getElementById('op-num')||{}).value)||nextOPNum();
  var cortador = (document.getElementById('op-cortador')||{}).value;
  var cat = (document.getElementById('op-cat')||{}).value;
  var nombre = ((document.getElementById('op-nombre')||{}).value||'').trim().toUpperCase();
  var ref = ((document.getElementById('op-ref')||{}).value||'').trim().toUpperCase();
  var vmo = parseInt((document.getElementById('op-vmo')||{}).value)||0;
  var tallas = Array.from(document.querySelectorAll('.op-talla:checked')).map(function(c){ return c.value; });

  if(!fecha || !cortador || !cat || !nombre || !_colores.length){
    toast('Completa todos los campos requeridos', 'error'); return;
  }

  // Build quantities
  var cantidades = {};
  var totalOTs = 0;
  document.querySelectorAll('.qty-input').forEach(function(inp){
    var v = parseInt(inp.value)||0;
    if(v > 0){
      cantidades[inp.dataset.color + '_' + inp.dataset.talla] = v;
      totalOTs++;
    }
  });
  if(totalOTs === 0){ toast('Ingresa cantidades para al menos una combinación', 'error'); return; }

  var opId = 'OP-' + new Date().getFullYear() + '-' + String(numOp).padStart(3,'0');
  var op = {
    id: opId, numero: numOp, fecha_op: fecha, cortador: cortador,
    categoria: cat, nombre_producto: nombre, colores: _colores.slice(), tallas: tallas,
    cantidades: cantidades, op_effi: null, estado_op: 'EN_PROCESO',
    created_at: hoy(), created_by: getUser()
  };
  DB.ops.push(op);

  // Generate OTs
  var otNum = nextOTNum();
  var newOTs = [];
  _colores.forEach(function(col){
    tallas.forEach(function(talla){
      var qty = cantidades[col + '_' + talla];
      if(!qty) return;
      var ot = {
        id: uid(), numero_ot: otNum++, op_id: opId,
        categoria: cat, nombre: nombre, referencia: ref + talla,
        color: col, talla: talla, cantidad: qty, valor_mo: vmo,
        fecha_ot: fecha, satelite_id: null,
        fecha_entrega_corte_satelite: null, fecha_estimada_entrega: null,
        fecha_entrega_real: null, unidades_entregadas: 0, unidades_novedad: 0,
        estado: 'CORTE_POR_ALISTAR', nt_corte_satelite: null, nt_ingreso_planta: null,
        op_effi: null, cumplió_fecha: null, motivo_incumplimiento: '', notas: '',
        historial: [], created_at: hoy(), created_by: getUser()
      };
      newOTs.push(ot);
    });
  });
  DB.ots = DB.ots.concat(newOTs);

  setBtnLoading('btn-crear-op', true);
  saveLocal();
  var ok1 = await guardarArchivo('ops', {ops: DB.ops});
  var ok2 = await guardarArchivo('ots', {ots: DB.ots});
  setBtnLoading('btn-crear-op', false);
  if(ok1 && ok2){
    toast('OP creada con ' + newOTs.length + ' OTs', 'success');
    _colores = [];
    cerrarFormNuevaOP();
    navTo('ops');
  }
}
