function renderActivas(){
  var activas = DB.ots.filter(function(o){ return o.estado !== 'ENTREGADO'; });
  var h = '';
  h += '<div class="filter-row">';
  h += '<select id="f-estado" onchange="filtrarActivas()"><option value="">Todos los estados</option>' + ESTADOS.filter(function(e){ return e!=='ENTREGADO'; }).map(function(e){ return '<option>' + e + '</option>'; }).join('') + '</select>';
  h += '<select id="f-cat" onchange="filtrarActivas()"><option value="">Todas las categorías</option>' + CATEGORIAS.map(function(c){ return '<option>' + c + '</option>'; }).join('') + '</select>';
  h += '<select id="f-sat" onchange="filtrarActivas()"><option value="">Todos los satélites</option>' + DB.satelites.map(function(s){ return '<option value="' + s.id + '">' + s.nombre + '</option>'; }).join('') + '</select>';
  h += '<input id="f-buscar" placeholder="Buscar nombre..." oninput="filtrarActivas()" style="width:200px;">';
  h += '<button class="btn btn-ghost btn-sm" onclick="deseleccionarTodo()">Deseleccionar</button>';
  h += '<button class="btn btn-primary btn-sm" onclick="asignarMasivo()" id="btn-asignar-masivo" style="display:none;">Asignar seleccionadas</button>';
  h += '</div>';
  h += '<div id="activas-table"></div>';
  setTimeout(filtrarActivas, 20);
  return h;
}

function filtrarActivas(){
  var fEstado = (document.getElementById('f-estado')||{}).value;
  var fCat = (document.getElementById('f-cat')||{}).value;
  var fSat = (document.getElementById('f-sat')||{}).value;
  var fBuscar = ((document.getElementById('f-buscar')||{}).value||'').toLowerCase();

  var activas = DB.ots.filter(function(o){
    if(o.estado === 'ENTREGADO') return false;
    if(fEstado && o.estado !== fEstado) return false;
    if(fCat && o.categoria !== fCat) return false;
    if(fSat && o.satelite_id !== fSat) return false;
    if(fBuscar && !(o.nombre||'').toLowerCase().includes(fBuscar) && !(o.color||'').toLowerCase().includes(fBuscar) && !(o.op_id||'').toLowerCase().includes(fBuscar)) return false;
    return true;
  });

  var el = document.getElementById('activas-table');
  if(!el) return;
  if(!activas.length){ el.innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>No hay órdenes activas con esos filtros.</p></div>'; return; }

  var h = '<div class="table-wrap"><table id="tbl-activas"><thead><tr>';
  h += '<th><input type="checkbox" class="ck" onclick="toggleTodosCK(this)"></th>';
  h += '<th>OT #</th><th>OP</th><th>Producto</th><th>Color</th><th>Talla</th><th>Cant</th><th>Estado</th><th>Satélite</th><th>Fecha Est.</th><th>Días</th><th>Acciones</th></tr></thead><tbody>';
  activas.forEach(function(ot){
    var sel = selectedOTs.has(ot.id);
    var dias = diasRestantes(ot.fecha_estimada_entrega);
    h += '<tr>';
    h += '<td><input type="checkbox" class="ck ck-ot" data-id="' + ot.id + '" ' + (sel?'checked':'') + ' onclick="toggleOT(this)"></td>';
    h += '<td style="font-weight:700;color:var(--cyan);">OT-' + ot.numero_ot + '</td>';
    h += '<td style="font-size:12px;color:var(--dim);">' + (ot.op_id||'—') + '</td>';
    h += '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ot.nombre + '</td>';
    h += '<td>' + ot.color + '</td><td>' + ot.talla + '</td><td>' + ot.cantidad + '</td>';
    h += '<td>' + badge(ot.estado) + '</td>';
    h += '<td style="font-size:12px;">' + getSatNombre(ot.satelite_id) + '</td>';
    h += '<td style="font-size:12px;">' + fmtDate(ot.fecha_estimada_entrega) + '</td>';
    h += '<td>' + diasChip(dias) + '</td>';
    h += '<td style="white-space:nowrap;">';
    if(ot.estado === 'CORTE_POR_ALISTAR') h += '<button class="btn btn-primary btn-sm" onclick="modalAsignar(\'' + ot.id + '\')">Asignar</button> ';
    h += '<button class="btn btn-ghost btn-sm" onclick="verOT(\'' + ot.id + '\')">Ver</button>';
    h += '</td></tr>';
  });
  h += '</tbody></table></div>';
  el.innerHTML = h;
}

function toggleOT(cb){
  var id = cb.dataset.id;
  if(cb.checked) selectedOTs.add(id); else selectedOTs.delete(id);
  var btn = document.getElementById('btn-asignar-masivo');
  if(btn) btn.style.display = selectedOTs.size > 0 ? '' : 'none';
}
function toggleTodosCK(masterCb){
  document.querySelectorAll('.ck-ot').forEach(function(cb){ cb.checked = masterCb.checked; toggleOT(cb); });
}
function deseleccionarTodo(){
  selectedOTs.clear();
  document.querySelectorAll('.ck-ot').forEach(function(cb){ cb.checked = false; });
  var btn = document.getElementById('btn-asignar-masivo');
  if(btn) btn.style.display = 'none';
}

function modalAsignar(otId, isMasivo){
  var ids = isMasivo ? Array.from(selectedOTs) : [otId];
  var body = '<div class="form-group"><label class="form-label">Satélite *</label><select class="form-control" id="ma-sat">' + DB.satelites.filter(function(s){ return s.activo; }).map(function(s){ return '<option value="' + s.id + '">' + s.nombre + '</option>'; }).join('') + '</select></div>';
  body += '<div class="form-row"><div class="form-group"><label class="form-label">Fecha entrega corte a satélite</label><input class="form-control" type="date" id="ma-fec" value="' + hoy() + '"></div><div class="form-group"><label class="form-label">Fecha estimada entrega *</label><input class="form-control" type="date" id="ma-fest"></div></div>';
  body += '<div class="form-group"><label class="form-label">NT bodega corte</label><input class="form-control" id="ma-nt" placeholder="NT-XXXX"></div>';
  body += '<div class="form-group"><label class="form-label">Notas</label><input class="form-control" id="ma-notas"></div>';
  if(isMasivo) body += '<div style="color:var(--dim);font-size:12px;margin-top:8px;">Se asignarán ' + ids.length + ' OTs seleccionadas.</div>';
  var footer = '<button class="btn btn-primary" onclick="confirmarAsignar(' + JSON.stringify(ids) + ')"><span class="btn-text">✓ Asignar</span><span class="spinner"></span></button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>';
  openModal(isMasivo ? 'Asignar masivo' : 'Asignar OT', body, footer);
}
function asignarMasivo(){ modalAsignar(null, true); }

async function confirmarAsignar(ids){
  var satId = document.getElementById('ma-sat').value;
  var fec = document.getElementById('ma-fec').value;
  var fest = document.getElementById('ma-fest').value;
  var nt = document.getElementById('ma-nt').value;
  var notas = document.getElementById('ma-notas').value;
  if(!satId || !fest){ toast('Selecciona satélite y fecha estimada', 'error'); return; }
  var now = new Date().toISOString();
  ids.forEach(function(id){
    var ot = DB.ots.find(function(o){ return o.id===id; });
    if(!ot) return;
    ot.satelite_id = satId;
    ot.fecha_entrega_corte_satelite = fec;
    ot.fecha_estimada_entrega = fest;
    ot.nt_corte_satelite = nt;
    ot.notas = notas;
    ot.estado = 'EN_CONFECCION';
    ot.historial.push({fecha: now, accion: 'Asignado a ' + getSatNombre(satId), user: getUser()});
  });
  saveLocal(); selectedOTs.clear();
  var ok = await guardarArchivo('ots', {ots: DB.ots});
  if(ok){ toast('OTs asignadas correctamente', 'success'); closeModal(); renderPage('activas'); }
}

function verOT(id){
  var ot = DB.ots.find(function(o){ return o.id===id; });
  if(!ot) return;
  var body = '';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">';
  var fields = [['OT#','OT-'+ot.numero_ot],['OP',ot.op_id||'—'],['Categoría',ot.categoria],['Nombre',ot.nombre],['Color',ot.color],['Talla',ot.talla],['Cantidad',ot.cantidad+' uds'],['Valor MO',fmtCop(ot.valor_mo)],['Estado',badge(ot.estado)],['Satélite',getSatNombre(ot.satelite_id)],['Fecha OT',fmtDate(ot.fecha_ot)],['F. Entrega Corte',fmtDate(ot.fecha_entrega_corte_satelite)],['F. Est. Entrega',fmtDate(ot.fecha_estimada_entrega)],['F. Real Entrega',fmtDate(ot.fecha_entrega_real)],['Uds Entregadas',(ot.unidades_entregadas||0)],['Uds Novedad',(ot.unidades_novedad||0)],['NT Corte',ot.nt_corte_satelite||'—'],['NT Ingreso',ot.nt_ingreso_planta||'—'],['Cumplió fecha',ot.cumplió_fecha===null?'—':ot.cumplió_fecha?'✅ Sí':'❌ No'],['Motivo',ot.motivo_incumplimiento||'—']];
  fields.forEach(function(f){ body += '<div><div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;">' + f[0] + '</div><div style="font-size:13px;margin-top:2px;">' + f[1] + '</div></div>'; });
  body += '</div>';
  if(ot.notas){ body += '<div class="sep"></div><div style="font-size:12px;color:var(--dim);">Notas:</div><div style="font-size:13px;margin-top:4px;">' + ot.notas + '</div>'; }
  // Historial
  if(ot.historial && ot.historial.length){
    body += '<div class="sep"></div><div class="section-title" style="font-size:14px;">Historial</div>';
    ot.historial.slice().reverse().forEach(function(h){ body += '<div class="hist-item"><div>' + h.accion + '</div><div class="hist-date">' + new Date(h.fecha).toLocaleString('es-CO') + (h.user?' · '+h.user:'') + '</div></div>'; });
  }
  var footer = '';
  if(ot.estado !== 'ENTREGADO' && ot.estado !== 'NOVEDAD'){
    footer += '<button class="btn btn-primary btn-sm" onclick="closeDrawer();modalEntrega(\'' + ot.id + '\')">Registrar entrega</button> ';
  }
  footer += '<button class="btn btn-ghost btn-sm" onclick="closeDrawer()">Cerrar</button>';
  openDrawer('OT-' + ot.numero_ot + ' · ' + ot.nombre, body, footer);
}

var _entFiltroMes = '';
var _entSatOpen = {};
function toggleEntSat(satId){ _entSatOpen[satId] = !_entSatOpen[satId]; renderPage('entregas'); }
function setEntFiltro(mes){ _entFiltroMes = mes; renderPage('entregas'); }

function renderEntregas(){
  var yearActual = hoy().substr(0,4);
  var filtroE = _entFiltroMes;
  var meses = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  var nomMes = ['Ene','Feb','Mar','Apr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // OTs en confección (activas) — no se filtra por mes, son las pendientes ahora
  var enConf = DB.ots.filter(function(o){ return o.estado==='EN_CONFECCION' || o.estado==='ASIGNADO'; });

  // ── Filter bar ──────────────────────────────────────────────────────────────
  var h = '';
  h += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;">';
  var allE = !filtroE;
  h += '<button onclick="setEntFiltro(\'\')" style="padding:5px 14px;border-radius:20px;border:1px solid ' + (allE?'var(--accent)':'var(--card-border)') + ';background:' + (allE?'var(--accent)':'transparent') + ';color:' + (allE?'#000':'var(--text)') + ';cursor:pointer;font-size:13px;font-weight:600;">Todo el año</button>';
  meses.forEach(function(m, i){
    var key = yearActual + '-' + m;
    var active = filtroE === key;
    h += '<button data-mes="' + key + '" onclick="setEntFiltro(this.dataset.mes)" style="padding:5px 12px;border-radius:20px;border:1px solid ' + (active?'var(--accent)':'var(--card-border)') + ';background:' + (active?'var(--accent)':'transparent') + ';color:' + (active?'#000':'var(--text)') + ';cursor:pointer;font-size:13px;">' + nomMes[i] + '</button>';
  });
  // Satellite selector
  var satIds = [];
  DB.satelites.forEach(function(s){ if(s.activo) satIds.push(s.id); });
  h += '<select id="ent-sat-sel" onchange="renderPage(\'entregas\')" style="margin-left:8px;background:var(--card-bg);color:var(--text);border:1px solid var(--card-border);border-radius:8px;padding:5px 10px;font-size:13px;"><option value="">Todos los satélites</option>';
  satIds.forEach(function(sid){ h += '<option value="' + sid + '">' + getSatNombre(sid) + '</option>'; });
  h += '</select>';
  h += '</div>';

  // Selected satellite filter (read from DOM if available)
  var selSat = '';
  try { var el = document.getElementById('ent-sat-sel'); if(el) selSat = el.value; } catch(e){}

  // ── KPI row ──────────────────────────────────────────────────────────────────
  var satConOts = {};
  enConf.forEach(function(o){ if(o.satelite_id) satConOts[o.satelite_id]=true; });
  var nSatActivos = Object.keys(satConOts).length;
  var udsTaller = enConf.reduce(function(a,o){ return a+(o.cantidad||0); },0);
  var promPorSat = nSatActivos ? Math.round(udsTaller/nSatActivos) : 0;

  h += '<div class="kpi-grid">';
  h += kpiCard('Satélites c/ OTs', nSatActivos, 'cyan', 'Con prendas en taller');
  h += kpiCard('OTs pendientes', enConf.length, '', 'Sin ENTREGADO');
  h += kpiCard('Uds en taller', fmtNum(udsTaller), '', 'Total en confección');
  h += kpiCard('Prom por satélite', fmtNum(promPorSat), '', 'Unidades/satélite');
  h += '</div>';

  // ── SVG Horizontal bar chart ranking ─────────────────────────────────────────
  var satRankMap = {};
  enConf.forEach(function(o){ if(o.satelite_id) satRankMap[o.satelite_id] = (satRankMap[o.satelite_id]||0)+(o.cantidad||0); });
  var satRank = Object.keys(satRankMap).map(function(k){ return {id:k,uds:satRankMap[k]}; }).sort(function(a,b){ return b.uds-a.uds; });

  if(satRank.length){
    var rowH=24, rowGap=6, PLh=120, PRh=50, PTh=10, PBh=16;
    var Wh=700, Hh = PTh + satRank.length*(rowH+rowGap) - rowGap + PBh;
    var maxRank = satRank[0].uds || 1;
    var availW = Wh - PLh - PRh;

    h += '<div class="card" style="margin-top:20px;padding:16px;">';
    h += '<div class="section-title" style="margin-bottom:10px;">Ranking satélites por unidades en confección</div>';
    h += '<svg viewBox="0 0 ' + Wh + ' ' + Hh + '" style="width:100%;max-width:' + Wh + 'px;display:block;">';
    satRank.forEach(function(s, i){
      var y0 = PTh + i*(rowH+rowGap);
      var bw = Math.max(4, Math.round(s.uds/maxRank*availW));
      h += '<text x="' + (PLh-6) + '" y="' + (y0+rowH/2+4) + '" fill="var(--text)" font-size="11" text-anchor="end">' + getSatNombre(s.id) + '</text>';
      h += '<rect x="' + PLh + '" y="' + y0 + '" width="' + bw + '" height="' + rowH + '" fill="var(--accent)" rx="3" opacity="0.85"/>';
      h += '<text x="' + (PLh+bw+5) + '" y="' + (y0+rowH/2+4) + '" fill="var(--dim)" font-size="11">' + s.uds + '</text>';
    });
    h += '</svg></div>';
  }

  // ── Satellite sections (accordion) ───────────────────────────────────────────
  h += '<div style="margin-top:20px;">';
  var bySat = {};
  enConf.forEach(function(ot){
    var sid = ot.satelite_id || 'SIN_SATELITE';
    if(selSat && sid !== selSat) return;
    (bySat[sid] = bySat[sid]||[]).push(ot);
  });

  // Sort: satellites with urgent OTs first
  var satOrder = Object.keys(bySat).filter(function(k){ return k !== 'SIN_SATELITE'; }).sort(function(a, b){
    var urgA = bySat[a].filter(function(o){ var d=diasRestantes(o.fecha_estimada_entrega); return d!==null && d<=3; }).length;
    var urgB = bySat[b].filter(function(o){ var d=diasRestantes(o.fecha_estimada_entrega); return d!==null && d<=3; }).length;
    return urgB - urgA;
  });
  if(bySat['SIN_SATELITE']) satOrder.push('SIN_SATELITE');

  satOrder.forEach(function(satId){
    var ots = bySat[satId];
    var satNom = satId === 'SIN_SATELITE' ? 'Sin satélite asignado' : getSatNombre(satId);
    var urgentes = ots.filter(function(o){ var d=diasRestantes(o.fecha_estimada_entrega); return d!==null && d<=3; }).length;
    // Auto-expand if has urgent OTs; otherwise respect toggle state
    var isOpen = _entSatOpen.hasOwnProperty(satId) ? _entSatOpen[satId] : (urgentes > 0);

    h += '<div class="card" style="margin-bottom:12px;padding:0;overflow:hidden;">';
    // Header
    h += '<div data-sat="' + satId + '" onclick="toggleEntSat(this.dataset.sat)" style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:var(--card-bg);">';
    h += '<div style="display:flex;align-items:center;gap:10px;">';
    h += '<span style="font-weight:700;font-size:14px;">' + satNom + '</span>';
    h += '<span style="font-size:12px;color:var(--dim);">' + ots.length + ' OTs · ' + ots.reduce(function(a,o){return a+(o.cantidad||0);},0) + ' uds</span>';
    if(urgentes){ h += '<span style="background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;">' + urgentes + ' urgentes</span>'; }
    h += '</div>';
    h += '<span style="color:var(--dim);font-size:16px;">' + (isOpen ? '▲' : '▼') + '</span>';
    h += '</div>';

    if(isOpen){
      h += '<div style="padding:0 16px 12px;">';
      h += '<table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr>';
      h += '<th style="text-align:left;padding:6px 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--card-border);">OT</th>';
      h += '<th style="text-align:left;padding:6px 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--card-border);">Producto</th>';
      h += '<th style="text-align:left;padding:6px 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--card-border);">Color</th>';
      h += '<th style="text-align:left;padding:6px 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--card-border);">Talla</th>';
      h += '<th style="text-align:right;padding:6px 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--card-border);">Cant</th>';
      h += '<th style="text-align:right;padding:6px 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--card-border);">Días</th>';
      h += '<th style="padding:6px 4px;border-bottom:1px solid var(--card-border);"></th>';
      h += '</tr></thead><tbody>';
      ots.forEach(function(ot){
        var dias = diasRestantes(ot.fecha_estimada_entrega);
        h += '<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">';
        h += '<td style="padding:6px 4px;font-weight:700;color:var(--accent);">OT-' + ot.numero_ot + '</td>';
        h += '<td style="padding:6px 4px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ot.nombre + '</td>';
        h += '<td style="padding:6px 4px;">' + ot.color + '</td>';
        h += '<td style="padding:6px 4px;">' + ot.talla + '</td>';
        h += '<td style="padding:6px 4px;text-align:right;">' + ot.cantidad + '</td>';
        h += '<td style="padding:6px 4px;text-align:right;">' + diasChip(dias) + '</td>';
        h += '<td style="padding:6px 4px;text-align:right;"><button class="btn btn-success btn-sm" data-ot="' + ot.id + '" onclick="modalEntrega(this.dataset.ot)">Registrar</button></td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
  });

  if(!Object.keys(bySat).length){
    h += '<div class="empty-state"><div class="icon">✅</div><p>No hay órdenes en confección actualmente.</p></div>';
  }

  h += '</div>';
  return h;
}

function modalEntrega(otId){
  var ot = DB.ots.find(function(o){ return o.id===otId; });
  if(!ot) return;
  var diasRestantes2 = diasRestantes(ot.fecha_estimada_entrega);
  var body = '<div style="background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;">';
  body += '<strong>OT-' + ot.numero_ot + '</strong> · ' + ot.nombre + ' · ' + ot.color + ' · ' + ot.talla + '<br>';
  body += '<span style="color:var(--dim);">Satélite: ' + getSatNombre(ot.satelite_id) + ' · Enviadas: ' + ot.cantidad + ' uds · F. Est: ' + fmtDate(ot.fecha_estimada_entrega) + ' ' + diasChip(diasRestantes2) + '</span>';
  body += '</div>';
  body += '<div class="form-row">';
  body += '<div class="form-group"><label class="form-label">Unidades entregadas *</label><input class="form-control" type="number" id="ent-uds" min="0" max="' + ot.cantidad + '" value="' + ot.cantidad + '" oninput="calcCumplimiento()"></div>';
  body += '<div class="form-group"><label class="form-label">Unidades con novedad</label><input class="form-control" type="number" id="ent-nov" min="0" value="0"></div>';
  body += '</div>';
  body += '<div class="form-row"><div class="form-group"><label class="form-label">Fecha real de entrega *</label><input class="form-control" type="date" id="ent-fecha" value="' + hoy() + '" oninput="calcCumplimiento()"></div><div class="form-group"><label class="form-label">NT ingreso a planta</label><input class="form-control" id="ent-nt" placeholder="NT-XXXX"></div></div>';
  body += '<div class="form-group" id="cumplimiento-wrap" style="display:flex;align-items:center;justify-content:space-between;">';
  body += '<label class="form-label">¿Cumplió fecha?</label><input type="checkbox" class="toggle" id="ent-cumplió"></div>';
  body += '<div class="form-group" id="motivo-wrap" style="display:none;"><label class="form-label">Motivo de incumplimiento</label><input class="form-control" id="ent-motivo"></div>';
  body += '<div class="form-group"><label class="form-label">Notas</label><textarea class="form-control" id="ent-notas"></textarea></div>';

  // Costo estimado
  body += '<div id="costo-preview" style="background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);border-radius:8px;padding:10px 14px;font-size:12px;margin-top:4px;"></div>';

  var footer = '<button class="btn btn-primary" id="btn-conf-entrega" onclick="confirmarEntrega(\'' + otId + '\')"><span class="btn-text">✓ Confirmar entrega</span><span class="spinner"></span></button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>';
  openModal('Registrar Entrega', body, footer);

  // init
  setTimeout(calcCumplimiento, 50);
  document.getElementById('ent-cumplió').addEventListener('change', function(){
    document.getElementById('motivo-wrap').style.display = this.checked ? 'none' : '';
  });
}

function calcCumplimiento(){
  var ot_fecha_est = drawerCtx; // not used, read from modal context
  var fechaEnt = (document.getElementById('ent-fecha')||{}).value;
  var uds = parseInt((document.getElementById('ent-uds')||{}).value)||0;
  var vmo = 0;
  // We don't easily have ot here, but update costo
  var costo = document.getElementById('costo-preview');
  if(costo) costo.innerHTML = '💰 Costo MO estimado: calculado al guardar';
}

async function confirmarEntrega(otId){
  var ot = DB.ots.find(function(o){ return o.id===otId; });
  if(!ot) return;
  var uds = parseInt((document.getElementById('ent-uds')||{}).value)||0;
  var nov = parseInt((document.getElementById('ent-nov')||{}).value)||0;
  var fecha = (document.getElementById('ent-fecha')||{}).value;
  var nt = (document.getElementById('ent-nt')||{}).value;
  var cumplió = (document.getElementById('ent-cumplió')||{}).checked;
  var motivo = (document.getElementById('ent-motivo')||{}).value || '';
  var notas = (document.getElementById('ent-notas')||{}).value || '';

  if(!uds || !fecha){ toast('Ingresa unidades y fecha', 'error'); return; }

  ot.unidades_entregadas = uds;
  ot.unidades_novedad = nov;
  ot.fecha_entrega_real = fecha;
  ot.nt_ingreso_planta = nt;
  ot.cumplió_fecha = cumplió;
  ot.motivo_incumplimiento = motivo;
  ot.notas = notas;
  ot.total_costo_mo = uds * (ot.valor_mo||0);

  if(nov > 0) ot.estado = 'ENTREGADO_PARCIAL';
  else ot.estado = 'ENTREGADO';

  ot.historial.push({fecha: new Date().toISOString(), accion: 'Entrega registrada: ' + uds + ' uds' + (nov?' ('+nov+' novedad)':''), user: getUser()});

  saveLocal(); updateNovBadge();
  var ok = await guardarArchivo('ots', {ots: DB.ots});
  if(ok){ toast('Entrega registrada · ' + uds + ' uds · ' + fmtCop(ot.total_costo_mo||0) + ' MO', 'success'); closeModal(); renderPage('entregas'); }
}

// ═══════════════════════════════════════════════════════════════════════════════
// INDICADORES
// ═══════════════════════════════════════════════════════════════════════════════
function renderIndicadores(){
  var mesActual = hoy().substr(0,7);
  var h = '<div class="filter-row">';
  h += '<input type="month" id="ind-mes" value="' + mesActual + '" class="form-control" style="width:auto;" onchange="renderPage(\'indicadores\')">';
  h += '</div>';

  var mes = (document.getElementById('ind-mes')||{}).value || mesActual;
  var otsDelMes = DB.ots.filter(function(o){ return (o.fecha_ot||'').startsWith(mes); });
  var entregados = DB.ots.filter(function(o){ return o.estado==='ENTREGADO' && (o.fecha_entrega_real||'').startsWith(mes); });
  var conFecha = entregados.filter(function(o){ return o.fecha_estimada_entrega; });
  var onTime = conFecha.filter(function(o){ return o.cumplió_fecha; }).length;
  var pct = conFecha.length ? Math.round(onTime/conFecha.length*100) : 0;
  var totalCortado = otsDelMes.reduce(function(a,o){ return a+o.cantidad; },0);
  var totalEnConf = DB.ots.filter(function(o){ return o.estado==='EN_CONFECCION'; }).reduce(function(a,o){ return a+o.cantidad; },0);
  var totalEntregado = entregados.reduce(function(a,o){ return a+(o.unidades_entregadas||0); },0);
  var totalMO = entregados.reduce(function(a,o){ return a+(o.total_costo_mo||0); },0);
  // avg dias en confección
  var diasList = entregados.filter(function(o){ return o.fecha_ot && o.fecha_entrega_real; }).map(function(o){ return (new Date(o.fecha_entrega_real)-new Date(o.fecha_ot))/86400000; });
  var avgDias = diasList.length ? Math.round(diasList.reduce(function(a,b){ return a+b; },0)/diasList.length) : 0;

  h += '<div class="kpi-grid">';
  h += kpiCard('Cortado (mes)', fmtNum(totalCortado) + ' uds', '', mes);
  h += kpiCard('En confección', fmtNum(totalEnConf) + ' uds', 'cyan', 'Actualmente');
  h += kpiCard('Entregado (mes)', fmtNum(totalEntregado) + ' uds', 'green', mes);
  h += kpiCard('% Cumplimiento', pct + '%', pct>=80?'green':pct>=60?'gold':'red', onTime + '/' + conFecha.length + ' on time');
  h += kpiCard('Avg días confección', avgDias + 'd', '', 'Por OT entregada');
  h += kpiCard('MO pagada (mes)', fmtCop(totalMO), 'gold', mes);
  h += '</div>';

  // Tabla por satélite
  h += '<div class="section-title">Rendimiento por satélite <span>' + mes + '</span></div>';
  var satPerf = {};
  DB.satelites.forEach(function(s){ satPerf[s.id] = {nombre:s.nombre, asignado:0, entregado:0, onTime:0, late:0, dias:[]}; });
  entregados.forEach(function(o){
    if(!o.satelite_id || !satPerf[o.satelite_id]) return;
    var sp = satPerf[o.satelite_id];
    sp.entregado += (o.unidades_entregadas||0);
    if(o.cumplió_fecha) sp.onTime++; else sp.late++;
    if(o.fecha_ot && o.fecha_entrega_real) sp.dias.push((new Date(o.fecha_entrega_real)-new Date(o.fecha_ot))/86400000);
  });
  DB.ots.filter(function(o){ return (o.fecha_ot||'').startsWith(mes) && o.satelite_id; }).forEach(function(o){
    if(satPerf[o.satelite_id]) satPerf[o.satelite_id].asignado += o.cantidad;
  });

  var rows = Object.values(satPerf).filter(function(sp){ return sp.asignado > 0 || sp.entregado > 0; }).sort(function(a,b){ return b.entregado-a.entregado; });
  if(rows.length){
    h += '<div class="table-wrap"><table><thead><tr><th>Satélite</th><th>Asignado</th><th>Entregado</th><th>On Time</th><th>Tarde</th><th>% Cumpl.</th><th>Avg días</th></tr></thead><tbody>';
    rows.forEach(function(sp){
      var total = sp.onTime + sp.late;
      var pctSat = total ? Math.round(sp.onTime/total*100) : 0;
      var avgD = sp.dias.length ? Math.round(sp.dias.reduce(function(a,b){ return a+b; },0)/sp.dias.length) : 0;
      h += '<tr><td style="font-weight:600;">' + sp.nombre + '</td><td>' + sp.asignado + '</td><td>' + sp.entregado + '</td><td style="color:var(--green);">' + sp.onTime + '</td><td style="color:var(--red);">' + sp.late + '</td><td><strong style="color:' + (pctSat>=80?'var(--green)':pctSat>=60?'var(--gold)':'var(--red)') + '">' + pctSat + '%</strong></td><td>' + avgD + 'd</td></tr>';
    });
    h += '</tbody></table></div>';
  } else { h += '<div style="color:var(--dim);font-size:13px;padding:20px 0;">Sin datos de satélites para este período.</div>'; }

  // Top categorías
  var catMap = {};
  entregados.forEach(function(o){ catMap[o.categoria] = (catMap[o.categoria]||0) + (o.unidades_entregadas||0); });
  var topCat = Object.entries(catMap).sort(function(a,b){ return b[1]-a[1]; });
  if(topCat.length){
    h += '<div class="section-title" style="margin-top:24px;">Top categorías <span>' + mes + '</span></div>';
    var maxC = topCat[0][1];
    h += '<div class="bar-wrap">';
    topCat.slice(0,8).forEach(function(c){ h += '<div class="bar-row"><div class="bar-label">' + c[0] + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(c[1]/maxC*100) + '%"></div></div><div class="bar-val">' + c[1] + '</div></div>'; });
    h += '</div>';
  }
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════════
// NOVEDADES
// ═══════════════════════════════════════════════════════════════════════════════
function renderNovedades(){
  var novs = DB.ots.filter(function(o){ return o.estado==='NOVEDAD' || (o.unidades_novedad||0)>0; });
  var h = '<div class="section-title">Novedades <span>' + novs.length + ' OTs</span></div>';
  if(!novs.length){ return h + '<div class="empty-state"><div class="icon">✅</div><p>Sin novedades pendientes.</p></div>'; }
  h += '<div class="table-wrap"><table><thead><tr><th>OT</th><th>Satélite</th><th>Producto</th><th>Color</th><th>Talla</th><th>Uds Novedad</th><th>Descripción</th><th>Estado</th><th>Acción</th></tr></thead><tbody>';
  novs.forEach(function(ot){
    h += '<tr><td style="font-weight:700;color:var(--cyan);">OT-' + ot.numero_ot + '</td>';
    h += '<td style="font-size:12px;">' + getSatNombre(ot.satelite_id) + '</td>';
    h += '<td>' + ot.nombre + '</td><td>' + ot.color + '</td><td>' + ot.talla + '</td>';
    h += '<td style="color:var(--red);font-weight:700;">' + (ot.unidades_novedad||0) + '</td>';
    h += '<td style="font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (ot.motivo_incumplimiento||'—') + '</td>';
    h += '<td>' + badge(ot.estado) + '</td>';
    h += '<td><button class="btn btn-success btn-sm" onclick="resolverNovedad(\'' + ot.id + '\')">Resolver</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

async function resolverNovedad(id){
  if(!confirm('¿Marcar esta novedad como resuelta?')) return;
  var ot = DB.ots.find(function(o){ return o.id===id; });
  if(!ot) return;
  ot.estado = 'ENTREGADO';
  ot.unidades_novedad = 0;
  ot.historial.push({fecha: new Date().toISOString(), accion: 'Novedad resuelta', user: getUser()});
  saveLocal(); updateNovBadge();
  var ok = await guardarArchivo('ots', {ots: DB.ots});
  if(ok){ toast('Novedad resuelta', 'success'); renderPage('novedades'); }
}

// ═══════════════════════════════════════════════════════════════════════════════
// HISTORIAL
// ═══════════════════════════════════════════════════════════════════════════════
function renderHistorial(){
  var completados = DB.ots.filter(function(o){ return o.estado==='ENTREGADO'; }).sort(function(a,b){ return (b.fecha_entrega_real||'').localeCompare(a.fecha_entrega_real||''); });
  var h = '<div class="filter-row"><input id="hist-buscar" class="form-control" placeholder="Buscar producto, color, satélite..." style="max-width:320px;" oninput="filtrarHistorial()"></div>';
  h += '<div id="hist-table"></div>';
  setTimeout(filtrarHistorial, 20);
  return h;
}

function filtrarHistorial(){
  var q = ((document.getElementById('hist-buscar')||{}).value||'').toLowerCase();
  var completados = DB.ots.filter(function(o){ return o.estado==='ENTREGADO'; }).filter(function(o){
    if(!q) return true;
    return (o.nombre||'').toLowerCase().includes(q) || (o.color||'').toLowerCase().includes(q) || getSatNombre(o.satelite_id).toLowerCase().includes(q);
  }).sort(function(a,b){ return (b.fecha_entrega_real||'').localeCompare(a.fecha_entrega_real||''); });

  var el = document.getElementById('hist-table');
  if(!el) return;
  if(!completados.length){ el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>Sin resultados.</p></div>'; return; }
  var h = '<div class="table-wrap"><table><thead><tr><th>OT</th><th>OP</th><th>Producto</th><th>Color</th><th>Talla</th><th>Uds</th><th>MO Total</th><th>Satélite</th><th>F. Entrega</th><th>Cumplió</th></tr></thead><tbody>';
  completados.slice(0,100).forEach(function(ot){
    h += '<tr onclick="verOT(\'' + ot.id + '\')" style="cursor:pointer;">';
    h += '<td style="font-weight:700;color:var(--cyan);">OT-' + ot.numero_ot + '</td>';
    h += '<td style="font-size:11px;color:var(--dim);">' + (ot.op_id||'—') + '</td>';
    h += '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ot.nombre + '</td>';
    h += '<td>' + ot.color + '</td><td>' + ot.talla + '</td>';
    h += '<td>' + (ot.unidades_entregadas||0) + '</td>';
    h += '<td>' + fmtCop(ot.total_costo_mo||0) + '</td>';
    h += '<td style="font-size:12px;">' + getSatNombre(ot.satelite_id) + '</td>';
    h += '<td>' + fmtDate(ot.fecha_entrega_real) + '</td>';
    h += '<td>' + (ot.cumplió_fecha===null?'—':ot.cumplió_fecha?'✅':'❌') + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  el.innerHTML = h;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function setBtnLoading(id, on){
  var btn = document.getElementById(id);
  if(!btn) return;
  if(on){ btn.classList.add('loading'); btn.disabled = true; }
  else { btn.classList.remove('loading'); btn.disabled = false; }
}

// CSS.escape polyfill
if(!window.CSS || !window.CSS.escape){
  window.CSS = window.CSS || {};
  window.CSS.escape = function(s){ return s.replace(/[!"#$%&'()*+,.\/:;<=>?@[\\\]^`{|}~]/g,'\\$&'); };
}

// ─── Init ─────────────────────────────────────────────────────────────────────
initUser();
// Try loading from local first for instant render
var _localDB = localStorage.getItem('bentley_prod_db');
if(_localDB){ try{ DB = JSON.parse(_localDB); if(DB.satelites.length===0) seedSatelites(); }catch(e){ seedSatelites(); } }
else { seedSatelites(); }
updateNovBadge();
renderPage('dashboard');
// Then load from GitHub Pages (async)
cargarDatos();
